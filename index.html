<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Çizim Atölyesi</title>
<link rel="icon" href="app-icon-192.png">
<meta name="theme-color" content="#23262c">
<style>
:root{--bg:#17191d;--panel:#23262c;--panel2:#2c3038;--line:#383d47;--txt:#e9eaee;--mut:#9aa1ad;--acc:#4f9dff;--accbg:#1f3552;--acctx:#cfe4ff;--stage:#2b2e35;--r:10px}
body.light{--bg:#e9ecf1;--panel:#ffffff;--panel2:#f1f3f7;--line:#d6dbe3;--txt:#1c2330;--mut:#667085;--acc:#2f7de1;--accbg:#e2eeff;--acctx:#1557b0;--stage:#d9dde4}
body.light .cpair .c{border-color:#fff;box-shadow:0 0 0 1px #0004}
body.light .dlg{box-shadow:0 20px 60px #0004}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
svg{display:block}
#app{display:grid;height:100%;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "tools stage side"}
/* ---- top bar ---- */
#top{grid-area:top;display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;flex-wrap:nowrap}
.grp{display:flex;align-items:center;gap:2px;flex-shrink:0}
.brand{font-weight:700;letter-spacing:.2px;padding:0 8px 0 4px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand .logo{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:block}
#opts{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 4px}
#opts::-webkit-scrollbar{display:none}
.ib{width:40px;height:40px;border-radius:var(--r);border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--panel2)}
.ib:active{background:var(--line)}
.ib.on{background:var(--accbg);border-color:var(--acc);color:var(--acctx)}
.ib:disabled{opacity:.3;pointer-events:none}
/* ---- tools ---- */
#tools{grid-area:tools;display:flex;flex-direction:column;gap:3px;padding:6px 5px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;align-items:center}
#tools::-webkit-scrollbar{display:none}
#tools .ib{width:44px;height:44px}
#tools .ib svg{width:23px;height:23px}
#tools .sep{width:28px;height:1px;background:var(--line);margin:3px 0;flex-shrink:0}
/* ---- stage ---- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--stage);min-width:0;min-height:0}
#view{position:absolute;left:0;top:0;touch-action:none;outline:none}
#animBar{position:absolute;left:0;right:0;bottom:0;display:none;align-items:center;gap:5px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#stage.anim-on #animBar{display:flex}#stage.anim-on #hud,#stage.anim-on #zoomCtl{bottom:78px}
#animBar .ab{flex-shrink:0;height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:16px;padding:0 8px}
#animBar .ab.on{background:var(--accbg);border-color:var(--acc)}#animBar .ab.wide{font-size:13px;font-weight:600}
.afrs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:80px;scrollbar-width:thin}
.afr{width:72px;height:54px;border-radius:6px;border:2px solid var(--line);cursor:pointer;flex-shrink:0;background:#fff}
.afr.on{border-color:var(--acc)}.afr.play{border-color:#ff9800}
#hud{position:absolute;left:8px;bottom:8px;background:#000a;color:#dde;font-size:12px;padding:4px 9px;border-radius:14px;pointer-events:none;white-space:nowrap}
#zoomCtl{position:absolute;right:8px;bottom:8px;display:flex;gap:2px;background:#000a;border-radius:14px;padding:2px;color:#fff}
#zoomCtl button{background:transparent;border:0;height:30px;min-width:30px;border-radius:12px;cursor:pointer;padding:0 6px;font-size:13px}
#zoomCtl button:hover{background:#fff2}
#zoomCtl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
/* ---- side ---- */
#side{grid-area:side;width:292px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;background:transparent;border:0;padding:11px 0;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:600}
.tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
.tabs .x{flex:0 0 44px;font-size:18px}
.pane{flex:1;overflow-y:auto;padding:12px;display:none;min-height:0}
.pane.on{display:block}
#scrim{position:fixed;inset:0;background:#0007;z-index:25;display:none}
#app.lefty{grid-template-areas:"top top top" "side stage tools"}
#app.lefty #tools{border-right:0;border-left:1px solid var(--line)}
#app.lefty #side{border-left:0;border-right:1px solid var(--line)}
#app.lefty #zoomCtl{right:auto;left:8px}#app.lefty #hud{left:auto;right:8px}
@media (min-width:1000px){#app:not(.side-open) #side{display:none}}
@media (max-width:999px){
  #side{position:fixed;right:0;top:0;bottom:0;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 30px #0008}
  #app.side-open #side{transform:none}
  #app.side-open #scrim{display:block}
  #app.lefty #side{right:auto;left:0;transform:translateX(-105%);box-shadow:8px 0 30px #0008}
  #app.lefty.side-open #side{transform:none}
}
/* portrait phones / tablets */
@media (orientation:portrait) and (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "stage" "tools"}
  #top{flex-wrap:wrap;row-gap:4px}
  #opts{order:3;flex-basis:100%;padding:2px 0 0;border-top:1px solid var(--line);padding-top:5px}
  #top>.grp:first-child{flex:1 1 0;min-width:0}
  #top .ib{width:36px;height:38px}
  #top .ib svg{width:20px;height:20px}
  .brand{flex:1;min-width:0;overflow:hidden;padding:0 2px;gap:5px}
  .brand span{white-space:nowrap;font-size:15px;letter-spacing:-.2px}
  #app.lefty #side,#app.lefty.side-open #side{left:0;right:0;transform:translateY(105%)}
  #app.lefty.side-open #side{transform:none}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
  #tools .sep{width:1px;height:28px;margin:0 3px}
  #side{top:auto;left:0;bottom:0;right:0;width:auto;height:64vh;border-radius:16px 16px 0 0;transform:translateY(105%);border-left:0;border-top:1px solid var(--line)}
}
/* landscape phones (short height) */
@media (orientation:landscape) and (max-height:560px){
  #top{padding:2px 4px}
  .ib{width:36px;height:36px}
  #tools{padding:3px;gap:1px}
  #tools .ib{width:36px;height:34px}
  #tools .ib svg{width:20px;height:20px}
  #tools .sep{display:none}
  .brand span{display:none}
  #side{width:300px}
  .pane{padding:8px}
  #hud{display:none}
}
@media (max-width:430px){.brand .logo{width:22px;height:22px;border-radius:6px}.brand span{font-size:14px}}
@media (orientation:portrait) and (max-width:375px){#top .ib{width:32px}#top{gap:2px;padding:5px 4px}.brand span{font-size:13.5px}.brand{gap:4px}}
@media (orientation:portrait) and (max-width:340px){.brand span{font-size:12px}.brand .logo{width:20px;height:20px}}
/* ---- options widgets ---- */
.cpair{position:relative;width:46px;height:40px;flex-shrink:0}
.cpair .c{position:absolute;width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px #0008;cursor:pointer}
.cpair .c.p{left:2px;top:2px;z-index:2}
.cpair .c.s{left:16px;top:12px}
.cpair .sw{position:absolute;right:-4px;top:-2px;font-size:11px;cursor:pointer;color:var(--mut);background:none;border:0;padding:2px}
.osep{width:1px;height:26px;background:var(--line);flex-shrink:0}
.chips{display:flex;gap:3px;flex-shrink:0}
.chip{height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;font-size:13px;flex-shrink:0}
.chip.ic{width:34px;padding:0;justify-content:center}
.chip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acctx)}
.chip.go{background:#1f6f3f;border-color:#2e9c5a;color:#fff}
.chip.no{background:#8b3a3a;border-color:#a54848;color:#fff}
.sl{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:12px;color:var(--mut)}
.sl input[type=range]{width:96px;accent-color:var(--acc)}
.sl b{min-width:28px;color:var(--txt);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.osel{height:32px;border-radius:8px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:0 6px;flex-shrink:0}
.info{font-size:12px;color:var(--mut);white-space:nowrap}
/* ---- color pane ---- */
.bigpair{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bigsw{flex:1;height:44px;border-radius:10px;border:2px solid var(--line);cursor:pointer;position:relative;background-clip:padding-box}
.bigsw.on{border-color:var(--acc);box-shadow:0 0 0 2px #4f9dff55}
.bigsw span{position:absolute;left:6px;bottom:-18px;font-size:11px;color:var(--mut)}
#svBox,#hueBar,#aBar{width:100%;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#svBox{height:170px;margin-top:14px}
#hueBar,#aBar{height:18px;margin-top:10px}
.hexrow{display:flex;gap:6px;margin-top:10px;align-items:center}
.hexrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.lbl{font-size:11px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.palbar{display:flex;gap:6px;margin-bottom:8px}.palbar select{flex:1;min-width:0;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px}.palbar .btn{padding:6px 12px}
.palbtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.palbtns .chip{height:30px;font-size:12px}
.pal.del div{outline:2px dashed #e5533d;outline-offset:-2px}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.pal div{aspect-ratio:1;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px #0005}
.pal div:hover{transform:scale(1.1)}
/* ---- layers pane ---- */
.lbtns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.lbtns .ib{width:38px;height:36px;background:var(--panel2)}
.lbtns .ib svg{width:18px;height:18px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:4px;background:var(--panel2)}
.lrow.on{border-color:var(--acc);background:var(--accbg)}
.lrow canvas{width:56px;height:42px;border-radius:5px;background:#fff;flex-shrink:0;box-shadow:0 0 0 1px #0006}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;color:var(--mut);font-size:11px}
.lrow .eye{width:34px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.lrow .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.lrow.hid .nm,.lrow.hid canvas{opacity:.4}
.lprops{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.prow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}
.prow input[type=range]{flex:1;accent-color:var(--acc)}
.prow select{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.dlg h3{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg h3 button{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);padding:0 4px}
.dlg .body{padding:14px 16px;overflow-y:auto;user-select:text;-webkit-user-select:text}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.g{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.d{background:#c62828}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--mut)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px}
.field textarea{min-height:80px;resize:vertical}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#outImg{max-width:100%;max-height:48vh;display:block;margin:0 auto 10px;border-radius:8px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.note{font-size:13px;color:var(--mut);text-align:center;margin:0}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.menu h4{grid-column:1/-1;margin:10px 0 2px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.menu h4:first-child{margin-top:0}
.menu button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font-size:13px}
.menu button:hover{border-color:var(--acc)}
.menu button kbd{float:right;color:var(--mut);font-size:11px;font-family:inherit}
@media (pointer:coarse){.menu button kbd{display:none}}
.dlg.wide{width:min(760px,100%)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gcard{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;user-select:none}
.gcard:hover{border-color:var(--acc)}.gcard.on{border-color:var(--acc);box-shadow:0 0 0 2px #4f9dff44}
.gimg{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#e4e4e4 0 25%,#fff 0 50%) 0 0/14px 14px;display:grid;place-items:center}
.gimg img,.gimg canvas{width:100%;height:100%;object-fit:contain;display:block}
.gnew .gimg{background:var(--bg);border:2px dashed var(--line)}.gnew .gimg span{font-size:34px;color:var(--mut)}
.gname{font-size:13px;font-weight:600;margin:6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.gdate{font-size:11px;color:var(--mut);margin:1px 2px 2px}
.gmore{position:absolute;right:4px;bottom:6px;background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px}
.gmore:hover{background:var(--line)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.keys kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit;font-size:12px;white-space:nowrap;justify-self:start}
#textPrev{width:100%;height:90px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:8px;margin-bottom:12px;display:block}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000e;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DPR=Math.min(window.devicePixelRatio||1,2);
const APP=window.CizimApp||null;   // Android uygulaması içindeyse köprü
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const cloneC=c=>{const n=mk(c.width,c.height);n.getContext('2d').drawImage(c,0,0);return n};
const el=(t,cls,html)=>{const e=document.createElement(t);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=1;

/* ================= ICONS ================= */
const IC={
 select:'<path d="M4 8V5a1 1 0 011-1h3M14 4h2M20 8V5a1 1 0 00-1-1h-1M4 14v2M4 20v-1M20 14v2M8 20h2M14 20h1" /><path d="M13 13l7 3-3 1-1 3z"/>',
 hand:'<path d="M8 13V5.5a1.5 1.5 0 013 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 013 0V11"/><path d="M14 10.5V6a1.5 1.5 0 013 0v5"/><path d="M17 9.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1.5a6 6 0 01-4.6-2.2L5 15.5a1.6 1.6 0 012.4-2.1L8 14"/>',
 brush:'<path d="M18 3l3 3-9.5 9.5-3-3z"/><path d="M8.5 12.5C5 12.5 4 15 4 17s-1 3-2 3c3 1 7 0 8-3.5"/>',
 eraser:'<path d="M7 21h13"/><path d="M5 15l9-9 6 6-7 7H8z"/><path d="M9 11l6 6"/>',
 fill:'<path d="M5 11l7-7 7 7-7 7z"/><path d="M5 11h14"/><path d="M20 15s2 2.5 2 4a2 2 0 01-4 0c0-1.5 2-4 2-4z"/>',
 gradient:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l12-12M3 21L21 3M9 21l12-12" opacity=".5"/>',
 picker:'<path d="M14 4l6 6"/><path d="M16.5 2.5a2.1 2.1 0 013 3L17 8l-3-3z"/><path d="M15 7L5 17l-1 3 3-1L17 9"/>',
 text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
 shape:'<rect x="3" y="11" width="9" height="9" rx="1"/><circle cx="16" cy="8" r="5"/>',
 // shapes
 line:'<path d="M4 20L20 4"/>',arrow:'<path d="M4 20L20 4M11 4h9v9"/>',rect:'<rect x="3" y="6" width="18" height="12" rx="1"/>',
 rrect:'<rect x="3" y="6" width="18" height="12" rx="4"/>',ellipse:'<ellipse cx="12" cy="12" rx="9" ry="7"/>',tri:'<path d="M12 4l9 16H3z"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',hex:'<path d="M7 4h10l5 8-5 8H7l-5-8z"/>',
 heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3 3.9M6.6 6.6A17 17 0 002 12s3.5 7 10 7a9.7 9.7 0 005.4-1.6"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;

/* ================= STATE ================= */
const PREF_KEY='cizim_atolyesi_prefs_v2';
const S={tool:'brush',brush:'round',shape:'rect',shapeMode:'stroke',primary:'#1e88e5',secondary:'#ffffff',size:14,opacity:100,smooth:35,tolerance:40,fillAll:false,sym:'none',gradType:'linear',gradTr:false,grid:false,recent:[],editing:'primary',font:'Arial',textSize:72,bold:true,italic:false,tOutline:false,tShadow:false,tAlign:'left',theme:'dark',leftHand:false,galleryOnStart:true,hardness:100,spacing:15,scatter:0,stamp:'grass',presets:[],guide:'none',guideSnap:true,selMode:'rect',selAdd:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch(e){}
S.editing='primary';
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(S))}catch(e){}}

const D={w:0,h:0,layers:[],active:0};
let stk,stx,stk2,stx2,scratch,scx;
let sel=null, floating=null, clip=null;
let stroking=false, strokeOp='source-over', strokeAlpha=1, strokeNeon=false;
let act=null, hover=null, spaceDown=false, penSeen=false;
const AL=()=>D.layers[D.active];
const ANIM={on:false,fps:8,onion:true,frame:1,playing:false};

function newLayer(name,w=D.w,h=D.h){const c=mk(w,h);return{id:uid++,name,canvas:c,ctx:c.getContext('2d'),visible:true,opacity:1,blend:'source-over'}}
function resetAux(){stk=mk(D.w,D.h);stx=stk.getContext('2d');stk2=mk(D.w,D.h);stx2=stk2.getContext('2d');scratch=mk(D.w,D.h);scx=scratch.getContext('2d');sel=null;floating=null;stroking=false}
function initDoc(w,h,bg){
  D.w=w;D.h=h;D.layers=[];
  const b=newLayer('Arka plan');if(bg){b.ctx.fillStyle=bg;b.ctx.fillRect(0,0,w,h)}
  D.layers.push(b);D.layers.push(newLayer('Katman 1'));D.active=1;
  resetAux();fit();refreshLayers();afterChange();
}

/* ================= HISTORY ================= */
const hist=[],redoH=[],MAXH=28;
function trim(){while(hist.length>MAXH)hist.shift()}
function pushL(L){hist.push({t:'L',id:L.id,c:cloneC(L.canvas)});trim();redoH.length=0;updUR()}
function snapDoc(){return{w:D.w,h:D.h,active:D.active,layers:D.layers.map(L=>({id:L.id,name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,alphaLock:!!L.alphaLock,clip:!!L.clip,c:cloneC(L.canvas)}))}}
function pushD(){hist.push({t:'D',s:snapDoc()});trim();redoH.length=0;updUR()}
function restoreDoc(s){
  const sizeChanged=s.w!==D.w||s.h!==D.h;
  D.w=s.w;D.h=s.h;D.active=s.active;
  D.layers=s.layers.map(o=>({id:o.id,name:o.name,visible:o.visible,opacity:o.opacity,blend:o.blend,alphaLock:o.alphaLock,clip:o.clip,canvas:o.c,ctx:o.c.getContext('2d')}));
  resetAux();if(sizeChanged)fit();refreshLayers();
}
function applyEntry(e,to){
  if(e.t==='L'){const L=D.layers.find(l=>l.id===e.id);if(!L)return;to.push({t:'L',id:L.id,c:cloneC(L.canvas)});L.ctx.save();L.ctx.globalCompositeOperation='copy';L.ctx.drawImage(e.c,0,0);L.ctx.restore()}
  else{to.push({t:'D',s:snapDoc()});restoreDoc(e.s)}
}
function undo(){
  if(stroking||(act&&act.kind!=='pinch'&&act.kind!=='none'))return;
  if(floating){const f=floating;floating=null;if(!f.lifted){dirty();updOpts();return}}
  if(!hist.length)return;applyEntry(hist.pop(),redoH);afterChange();updOpts();
}
function redo(){
  if(floating)commitFloating();
  if(!redoH.length)return;applyEntry(redoH.pop(),hist);afterChange();updOpts();
}
function updUR(){$('#bUndo').disabled=!hist.length&&!floating;$('#bRedo').disabled=!redoH.length}

/* ================= VIEW ================= */
const stage=$('#stage'),view=$('#view'),vx=view.getContext('2d');
const V={s:1,x:0,y:0};let SW=0,SH=0;
function resizeView(){
  const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  const ow=SW,oh=SH;SW=r.width;SH=r.height;
  view.width=Math.round(SW*DPR);view.height=Math.round(SH*DPR);view.style.width=SW+'px';view.style.height=SH+'px';
  if(ow&&D.w){V.x+=(SW-ow)/2;V.y+=(SH-oh)/2}
  dirty();
}
function fit(){const pad=Math.min(28,SW*.04);V.s=Math.min((SW-pad*2)/D.w,(SH-pad*2)/D.h);if(!isFinite(V.s)||V.s<=0)V.s=1;V.x=(SW-D.w*V.s)/2;V.y=(SH-D.h*V.s)/2;dirty();updHud()}
function zoomTo(s,mx=SW/2,my=SH/2){const ns=clamp(s,0.03,40);const k=ns/V.s;V.x=mx-(mx-V.x)*k;V.y=my-(my-V.y)*k;V.s=ns;dirty();updHud()}
function zoomAt(f,mx,my){zoomTo(V.s*f,mx,my)}
function toDoc(cx,cy){const r=view.getBoundingClientRect();return{x:(cx-r.left-V.x)/V.s,y:(cy-r.top-V.y)/V.s}}
function updHud(){$('#zPct').textContent=Math.round(V.s*100)+'%';$('#hud').textContent=`${D.w}×${D.h}`+(hover?` · ${Math.floor(hover.x)}, ${Math.floor(hover.y)}`:'')+` · ${AL()?esc(AL().name):''}`}

let needs=false;function dirty(){if(!needs){needs=true;requestAnimationFrame(render)}}
const checker=(()=>{const c=mk(16,16),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,16,16);x.fillStyle='#d5d8dc';x.fillRect(0,0,8,8);x.fillRect(8,8,8,8);return c})();
let pat=null,ants=0,stageBg='#2b2e35';
function applyTheme(){document.body.classList.toggle('light',S.theme==='light');app.classList.toggle('lefty',!!S.leftHand);stageBg=getComputedStyle(document.body).getPropertyValue('--stage').trim()||'#2b2e35';dirty();setTimeout(()=>{resizeView();drawPickers()},50)}
setInterval(()=>{if(sel||floating){ants=(ants+1)%16;dirty()}},120);

function applyStroke(c){
  let src=stk;const masked=sel&&!floating&&sel.mask;
  if(strokeNeon||masked){const x=maskTmp();x.drawImage(stk,0,0);if(strokeNeon)x.drawImage(stk2,0,0);if(masked){x.globalCompositeOperation='destination-in';x.drawImage(sel.mask,sel.x,sel.y)}src=mtmp}
  c.save();
  if(sel&&!floating&&!sel.mask){c.beginPath();c.rect(sel.x,sel.y,sel.w,sel.h);c.clip()}
  let op=strokeOp;if(AL()&&AL().alphaLock&&op!=='destination-out')op='source-atop';
  c.globalAlpha=strokeAlpha;c.globalCompositeOperation=op;c.drawImage(src,0,0);
  c.restore();
}
function render(){
  needs=false;const c=vx;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.fillStyle=stageBg;c.fillRect(0,0,view.width,view.height);
  if(!D.w)return;
  c.setTransform(DPR*V.s,0,0,DPR*V.s,DPR*V.x,DPR*V.y);
  c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=18*DPR;c.fillStyle='#fff';c.fillRect(0,0,D.w,D.h);c.restore();
  if(!pat)pat=c.createPattern(checker,'repeat');
  try{pat.setTransform(new DOMMatrix().scale(1/V.s))}catch(e){}
  c.fillStyle=pat;c.fillRect(0,0,D.w,D.h);
  c.imageSmoothingEnabled=V.s<2;
  compositeLayers(c,true);
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  const lw=1/V.s;
  // grid
  if(S.grid){
    let step=10;while(step*V.s<14)step*=2;
    c.beginPath();
    for(let x=step;x<D.w;x+=step){c.moveTo(x,0);c.lineTo(x,D.h)}
    for(let y=step;y<D.h;y+=step){c.moveTo(0,y);c.lineTo(D.w,y)}
    c.strokeStyle='rgba(0,0,0,.16)';c.lineWidth=lw;c.stroke();
  }
  if(V.s>=12){
    const x0=Math.max(0,Math.floor(-V.x/V.s)),x1=Math.min(D.w,Math.ceil((SW-V.x)/V.s)),y0=Math.max(0,Math.floor(-V.y/V.s)),y1=Math.min(D.h,Math.ceil((SH-V.y)/V.s));
    c.beginPath();for(let x=x0;x<=x1;x++){c.moveTo(x,y0);c.lineTo(x,y1)}for(let y=y0;y<=y1;y++){c.moveTo(x0,y);c.lineTo(x1,y)}
    c.strokeStyle='rgba(128,128,128,.25)';c.lineWidth=lw;c.stroke();
  }
  // symmetry guides
  if(S.sym!=='none'&&['brush','eraser','shape'].includes(S.tool)){
    c.save();c.setLineDash([6*lw,6*lw]);c.strokeStyle='rgba(79,157,255,.7)';c.lineWidth=lw*1.5;c.beginPath();
    const cx=D.w/2,cy=D.h/2;
    if(S.sym==='v'||S.sym==='4'){c.moveTo(cx,0);c.lineTo(cx,D.h)}
    if(S.sym==='h'||S.sym==='4'){c.moveTo(0,cy);c.lineTo(D.w,cy)}
    if(S.sym==='r6'||S.sym==='r8'){const n=S.sym==='r6'?6:8,R=Math.hypot(D.w,D.h);for(let k=0;k<n;k++){const a=k*Math.PI*2/n-Math.PI/2;c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R)}}
    c.stroke();c.restore();
  }
  drawGuide(c,lw);
  // selection / floating
  const ants2=(path)=>{c.save();c.lineWidth=lw*1.5;c.setLineDash([5*lw,5*lw]);c.strokeStyle='#000';c.lineDashOffset=-ants*lw;path();c.stroke();c.strokeStyle='#fff';c.lineDashOffset=-ants*lw+5*lw;path();c.stroke();c.restore()};
  const poly=q=>()=>{c.beginPath();q.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()};
  if(floating){
    const q=fCorners(floating);ants2(poly(q));
    const hs=floatHandles(floating),hr=10/V.s;
    if(!floating.quad){const top={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2},rh=hs[1].p;c.beginPath();c.moveTo(top.x,top.y);c.lineTo(rh.x,rh.y);c.strokeStyle='#4f9dff';c.lineWidth=1.5*lw;c.stroke()}
    hs.forEach(h=>{c.beginPath();c.arc(h.p.x,h.p.y,hr,0,Math.PI*2);c.fillStyle=h.k==='rot'?'#ff9800':'#4f9dff';c.fill();c.strokeStyle='#fff';c.lineWidth=2*lw;c.stroke()});
  }else if(sel){
    if(sel.tint){c.drawImage(sel.tint,sel.x,sel.y)}
    if(sel.pts)ants2(poly(sel.pts));
    else if(!sel.mask)ants2(()=>{c.beginPath();c.rect(sel.x,sel.y,sel.w,sel.h)});
    else{c.save();c.setLineDash([3*lw,4*lw]);c.strokeStyle='rgba(79,157,255,.9)';c.lineWidth=lw;c.strokeRect(sel.x,sel.y,sel.w,sel.h);c.restore()}
  }
  if(act&&act.kind==='marquee'&&act.r){const r=act.r;ants2(()=>{c.beginPath();c.rect(r.x,r.y,r.w,r.h)})}
  if(act&&act.kind==='lasso'&&act.pts.length>1){ants2(()=>{c.beginPath();act.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y))})}
  // brush cursor
  if(hover&&hover.mouse&&['brush','eraser'].includes(S.tool)&&!spaceDown){
    const r=Math.max(1,bw()/2);c.beginPath();c.arc(hover.x,hover.y,r,0,Math.PI*2);
    c.lineWidth=lw;c.strokeStyle='rgba(0,0,0,.7)';c.stroke();c.beginPath();c.arc(hover.x,hover.y,r+lw,0,Math.PI*2);c.strokeStyle='rgba(255,255,255,.8)';c.stroke();
  }
}

/* ================= CETVEL / PERSPEKTİF ================= */
let G=null;
function ensureGuide(){if(G&&G.w===D.w&&G.h===D.h)return G;const w=D.w,h=D.h;G={w,h,r1:{x:w*.2,y:h*.55},r2:{x:w*.8,y:h*.45},vp1:{x:w*.5,y:h*.4},vp2:{x:w*.94,y:h*.4},vpL:{x:w*.06,y:h*.4}};return G}
function guidePts(){const g=ensureGuide();if(S.guide==='ruler')return{r1:g.r1,r2:g.r2,rm:{x:(g.r1.x+g.r2.x)/2,y:(g.r1.y+g.r2.y)/2}};if(S.guide==='p1')return{vp1:g.vp1};if(S.guide==='p2')return{vpL:g.vpL,vp2:g.vp2};return{}}
function hitGuide(e){
  if(S.guide==='none'||!['brush','eraser','shape','hand','select'].includes(S.tool))return null;
  const r=view.getBoundingClientRect(),pts=guidePts(),lim=e.pointerType==='touch'?26:16;
  for(const k in pts){const p=pts[k];const sx=r.left+V.x+p.x*V.s,sy=r.top+V.y+p.y*V.s;if(Math.hypot(e.clientX-sx,e.clientY-sy)<lim)return k}
  return null;
}
function dragGuide(k,p,start){
  const g=ensureGuide();
  if(k==='rm'){const dx=p.x-start.p.x,dy=p.y-start.p.y;g.r1={x:start.r1.x+dx,y:start.r1.y+dy};g.r2={x:start.r2.x+dx,y:start.r2.y+dy}}
  else if(k==='vpL'||k==='vp2'){g[k]={x:p.x,y:p.y};const o=k==='vpL'?'vp2':'vpL';g[o]={x:g[o].x,y:p.y}}
  else g[k]={x:p.x,y:p.y};
  dirty();
}
function drawGuide(c,lw){
  if(S.guide==='none')return;const g=ensureGuide();c.save();
  const R=Math.hypot(D.w,D.h)*2;
  const handle=(p,col)=>{c.beginPath();c.arc(p.x,p.y,11*lw,0,Math.PI*2);c.fillStyle=col;c.fill();c.lineWidth=2.5*lw;c.strokeStyle='#fff';c.stroke()};
  if(S.guide==='ruler'){
    const dx=g.r2.x-g.r1.x,dy=g.r2.y-g.r1.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    c.lineCap='butt';c.strokeStyle='rgba(79,157,255,.22)';c.lineWidth=26*lw;c.beginPath();c.moveTo(g.r1.x-ux*R,g.r1.y-uy*R);c.lineTo(g.r1.x+ux*R,g.r1.y+uy*R);c.stroke();
    c.strokeStyle='rgba(30,100,220,.8)';c.lineWidth=1.5*lw;c.stroke();
    // ölçek çizgileri
    c.beginPath();for(let t=-R;t<R;t+=20/V.s*2){const px=g.r1.x+ux*t,py=g.r1.y+uy*t,k=Math.round(t/(40/V.s))%5===0?9:5;c.moveTo(px-uy*k*lw,py+ux*k*lw);c.lineTo(px+uy*k*lw,py+ux*k*lw)}
    c.strokeStyle='rgba(30,100,220,.45)';c.lineWidth=lw;c.stroke();

      const cands=[{x:1,y:0},{x:0,y:1}];(S.guide==='p1'?[g.vp1]:[g.vpL,g.vp2]).forEach(v=>{const dx=v.x-s0.x,dy=v.y-s0.y,L=Math.hypot(dx,dy);if(L>1)cands.push({x:dx/L,y:dy/L})});

function symMats(){
  const cx=D.w/2,cy=D.h/2,I=[1,0,0,1,0,0];
  switch(S.sym){
    case 'v':return[I,[-1,0,0,1,2*cx,0]];
    case 'h':return[I,[1,0,0,-1,0,2*cy]];
    case '4':return[I,[-1,0,0,1,2*cx,0],[1,0,0,-1,0,2*cy],[-1,0,0,-1,2*cx,2*cy]];
    case 'r6':case 'r8':{const n=S.sym==='r6'?6:8,m=[];for(let k=0;k<n;k++){const a=k*Math.PI*2/n,co=Math.cos(a),si=Math.sin(a);m.push([co,si,-si,co,cx-co*cx+si*cy,cy-si*cx-co*cy])}return m}
  }
  return[I];
}
function eachSym(c,fn){const ms=S.tool==='gradient'?[[1,0,0,1,0,0]]:symMats();for(const m of ms){c.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);fn()}c.setTransform(1,0,0,1,0,0)}

function bw(){const b=S.tool==='eraser'?'round':S.brush;let w=S.size;if(b==='pencil')w=Math.max(1,S.size*.35);if(b==='marker')w=S.size*1.6;return w}
function pressure(e){return e.pointerType==='pen'&&e.pressure>0?e.pressure:1}
function beginStroke(p,e,col){
  commitFloating();

  stroking=true;stx.clearRect(0,0,D.w,D.h);stx2.clearRect(0,0,D.w,D.h);
  const b=S.tool==='eraser'?'eraser':S.brush;

const tipCache={};
function tipCanvas(col,hard){
  const key=col+'|'+hard;if(tipCache[key])return tipCache[key];
  const R=64,c=mk(R*2,R*2),x=c.getContext('2d');const g=x.createRadialGradient(R,R,0,R,R,R);
  const [r,gg,b]=hex2rgb(col);const h=clamp(hard/100,0,.98);
  g.addColorStop(0,`rgba(${r},${gg},${b},1)`);g.addColorStop(h,`rgba(${r},${gg},${b},1)`);g.addColorStop(1,`rgba(${r},${gg},${b},0)`);
  x.fillStyle=g;x.fillRect(0,0,R*2,R*2);
  const ks=Object.keys(tipCache);if(ks.length>24)delete tipCache[ks[0]];
  return tipCache[key]=c;
}
function useDabs(b){return(b==='round'||b==='eraser')&&(S.hardness<100||S.scatter>0)}
function dabLine(a,b,w,first,drawOne){
  const sp=Math.max(.6,w*Math.max(2,S.spacing)/100);
  if(first){drawOne(a.x,a.y);act.rem=sp;return}
  const len=Math.hypot(b.x-a.x,b.y-a.y);if(len<=0)return;
  let d=act.rem;
  while(d<=len){const t=d/len;drawOne(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);d+=sp}
  act.rem=d-len;
}
const STAMPS=[['grass','🌿 Çimen'],['leaf','🍃 Yaprak'],['flower','🌼 Çiçek'],['star','⭐ Yıldız'],['heart','❤️ Kalp'],['cloud','☁️ Bulut'],['snow','❄️ Kar'],['dot','⚪ Nokta'],['confetti','🎉 Konfeti']];
function jitterCol(hex,amt){const [r,g,b]=hex2rgb(hex);const k=(Math.random()*2-1)*amt;return rgb2hex(r+k*255,g+k*255,b+k*255)}
function stampShape(c,type,r){
  c.beginPath();

    case 'grass':for(let i=-2;i<=2;i++){const bx=i*r*.28,h=r*(1.3+Math.random()*.9),lean=(Math.random()-.5)*r*.8;c.moveTo(bx-r*.09,r*.6);c.quadraticCurveTo(bx+lean*.3,r*.6-h*.5,bx+lean,r*.6-h);c.quadraticCurveTo(bx+lean*.2+r*.05,r*.6-h*.5,bx+r*.09,r*.6);c.closePath()}break;
    case 'leaf':c.moveTo(0,-r);c.quadraticCurveTo(r*.85,-r*.2,0,r);c.quadraticCurveTo(-r*.85,-r*.2,0,-r);break;
    case 'flower':for(let i=0;i<5;i++){const a=i*Math.PI*2/5;c.moveTo(0,0);c.ellipse(Math.cos(a)*r*.5,Math.sin(a)*r*.5,r*.42,r*.26,a,0,Math.PI*2)}break;
    case 'star':for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,k=i%2?.45:1;i?c.lineTo(Math.cos(a)*r*k,Math.sin(a)*r*k):c.moveTo(Math.cos(a)*r*k,Math.sin(a)*r*k)}c.closePath();break;

    case 'snow':break;

function stampAt(x,y,w,col){
  const t=S.stamp,r=w/2*(.7+Math.random()*.55);
  const rot=t==='grass'?(Math.random()-.5)*.35:t==='snow'||t==='dot'?0:Math.random()*Math.PI*2;
  let cc=col;if(t==='grass'||t==='leaf'||t==='flower'||t==='cloud')cc=jitterCol(col,.09);
  if(t==='confetti')cc=`hsl(${Math.random()*360|0},85%,58%)`;
  const ox=x+(Math.random()-.5)*w*S.scatter/50,oy=y+(Math.random()-.5)*w*S.scatter/50;
  eachSym(stx,()=>{
    const m=stx.getTransform();stx.translate(ox,oy);stx.rotate(rot);
    if(t==='snow'){stx.strokeStyle=cc;stx.lineWidth=Math.max(1,r*.13);stx.lineCap='round';stx.beginPath();
      for(let i=0;i<6;i++){const a=i*Math.PI/3,cx=Math.cos(a),sy=Math.sin(a);stx.moveTo(0,0);stx.lineTo(cx*r,sy*r);
        const bx=cx*r*.55,by=sy*r*.55;for(const s2 of[-1,1]){const a2=a+s2*.7;stx.moveTo(bx,by);stx.lineTo(bx+Math.cos(a2)*r*.3,by+Math.sin(a2)*r*.3)}}stx.stroke()}
    else{stx.fillStyle=cc;stampShape(stx,t,r);stx.fill();if(t==='flower'){stx.beginPath();stx.arc(0,0,r*.2,0,Math.PI*2);stx.fillStyle='#ffd54f';stx.fill()}}
    stx.setTransform(m);
  });
}
/* Leke (parmak) aracı: katmanı doğrudan, önceki noktadaki boyayı sürükleyerek değiştirir. */
let smTmp=null,smMask=null,smR=0;
function smudgeTo(p){
  const L=AL(),w=Math.max(2,bw()),r=Math.ceil(w/2),dd=r*2;
  if(!smTmp||smR!==r){smR=r;smTmp=mk(dd,dd);smMask=mk(dd,dd);const x=smMask.getContext('2d'),g=x.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.5,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,dd,dd)}
  const tx=smTmp.getContext('2d'),q=act.sq,len=Math.hypot(p.x-q.x,p.y-q.y),step=Math.max(1,r/4);
  if(len<step)return;
  const n=Math.floor(len/step);let a=q;
  for(let i=1;i<=n;i++){
    const b={x:q.x+(p.x-q.x)*i/n,y:q.y+(p.y-q.y)*i/n};
    tx.globalCompositeOperation='copy';tx.drawImage(L.canvas,a.x-r,a.y-r,dd,dd,0,0,dd,dd);
    tx.globalCompositeOperation='destination-in';tx.drawImage(smMask,0,0);
    if(sel&&sel.mask){tx.globalCompositeOperation='destination-in';tx.drawImage(sel.mask,sel.x-(b.x-r),sel.y-(b.y-r))}
    L.ctx.save();clipSel(L.ctx);if(L.alphaLock)L.ctx.globalCompositeOperation='source-atop';L.ctx.globalAlpha=clamp(S.opacity/100,0,1)*.85;L.ctx.drawImage(smTmp,b.x-r,b.y-r);L.ctx.restore();
    a=b;
  }

}
function clipSel(c){if(sel&&!floating&&!sel.mask){c.beginPath();c.rect(sel.x,sel.y,sel.w,sel.h);c.clip()}}
function seg(a,ctrl,b,first){

  if(A.b==='stamp'){const sp=Math.max(3,w*(.55+S.spacing/100));const sv=S.spacing;S.spacing=sp/w*100;dabLine(a,b,w,first,(x,y)=>stampAt(x,y,w,col));S.spacing=sv;return}

    dabLine(a,b,w,first,(x,y)=>{const sc=S.scatter/100*w;const ox=x+(Math.random()-.5)*2*sc,oy=y+(Math.random()-.5)*2*sc;
      const dw=w*(S.hardness<100?1.15:1);eachSym(stx,()=>stx.drawImage(tip,ox-dw/2,oy-dw/2,dw,dw))});
    return;
  }

  }
}
function spray(p,len){

function strokeMove(evs){
  const k=S.smooth/100*.88;
  for(const ev of evs){
    const raw=guideSnap(toDoc(ev.clientX,ev.clientY));act.raw=raw;act.pr=pressure(ev);
    const sp={x:act.last.x+(raw.x-act.last.x)*(1-k),y:act.last.y+(raw.y-act.last.y)*(1-k)};
    if(Math.hypot(sp.x-act.last.x,sp.y-act.last.y)<.4)continue;
    if(act.smudge){act.last=sp;smudgeTo(sp);continue}
    const mid={x:(act.last.x+sp.x)/2,y:(act.last.y+sp.y)/2};

  }

}

function shapePath(c,a,b,type){

    case 'arrow':{c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);const an=Math.atan2(b.y-a.y,b.x-a.x),hl=Math.max(S.size*3,14);

    case 'ellipse':c.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2);break;
    case 'tri':c.moveTo(cx,y0);c.lineTo(x1,y1);c.lineTo(x0,y1);c.closePath();break;
    case 'star':for(let i=0;i<10;i++){const an=-Math.PI/2+i*Math.PI/5,k=i%2?.42:1;const x=cx+Math.cos(an)*w/2*k,y=cy+Math.sin(an)*h/2*k;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();break;
    case 'hex':for(let i=0;i<6;i++){const an=i*Math.PI/3;const x=cx+Math.cos(an)*w/2,y=cy+Math.sin(an)*h/2;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();break;

function constrain(a,b,shift){
  if(!shift)return b;

const FONTS=['Arial','Georgia','Times New Roman','Courier New','Verdana','Trebuchet MS','Impact','Comic Sans MS','Palatino','system-ui','cursive','monospace'];
function renderText(t,col,col2){
  const st=(S.italic?'italic ':'')+(S.bold?'bold ':'')+S.textSize+'px "'+S.font+'"';
  const lines=t.split('\n');const m=mk(4,4).getContext('2d');m.font=st;
  const lh=Math.round(S.textSize*1.2),pad=Math.ceil(S.textSize*.25)+(S.tShadow?Math.ceil(S.textSize*.12):0)+(S.tOutline?Math.ceil(S.textSize*.08):0);
  const ws=lines.map(l=>m.measureText(l).width),W=Math.ceil(Math.max(1,...ws))+pad*2,H=lh*lines.length+pad*2;
  const c=mk(W,H),x=c.getContext('2d');x.font=st;x.textBaseline='middle';x.lineJoin='round';
  lines.forEach((l,i)=>{const lx=S.tAlign==='center'?(W-ws[i])/2:S.tAlign==='right'?W-pad-ws[i]:pad;const ly=pad+lh*i+lh/2;
    if(S.tShadow){x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=S.textSize*.12;x.shadowOffsetX=x.shadowOffsetY=S.textSize*.06;x.fillStyle=col;x.fillText(l,lx,ly);x.restore()}
    if(S.tOutline){x.lineWidth=Math.max(2,S.textSize*.12);x.strokeStyle=col2;x.strokeText(l,lx,ly)}
    x.fillStyle=col;x.fillText(l,lx,ly)});
  return c;
}
function openTextDialog(p,col,col2){

    <div class="field">Yazı<textarea id="tTx" placeholder="Bir şeyler yaz…"></textarea></div>

    <div class="checks">
      <button class="chip ${S.bold?'on':''}" data-k="bold"><b>K</b> Kalın</button>
      <button class="chip ${S.italic?'on':''}" data-k="italic"><i>E</i> Eğik</button>
      <button class="chip ${S.tOutline?'on':''}" data-k="tOutline">Kenarlık</button>
      <button class="chip ${S.tShadow?'on':''}" data-k="tShadow">Gölge</button>
    </div>
    <div class="checks">${['left','center','right'].map(a=>`<button class="chip ${S.tAlign===a?'on':''}" data-al="${a}">${{left:'Sola',center:'Ortala',right:'Sağa'}[a]}</button>`).join('')}</div>
    <p class="note" style="text-align:left;font-size:12px">Renk: ana renk. Kenarlık: ikinci renk. Ekledikten sonra yazıyı sürükleyip köşeden büyütebilirsin.</p>`,
    [{t:'Vazgeç',c:'g'},{t:'Ekle',fn:()=>{const t=$('#tTx').value;if(!t.trim())return false;const c=renderText(t,col,col2);makeFloating(c,Math.round(p.x),Math.round(p.y-c.height/2));savePrefs()}}]);
  const tx=$('#tTx'),pv=$('#textPrev');
  const upd=()=>{S.font=$('#tFont').value;S.textSize=clamp(+$('#tSize').value||72,6,600);const pc=pv.getContext('2d');pv.width=pv.clientWidth*DPR;pv.height=pv.clientHeight*DPR;pc.clearRect(0,0,pv.width,pv.height);
    const t=tx.value||'Örnek Yazı';const c=renderText(t,col,col2);const s=Math.min(pv.width*.94/c.width,pv.height*.9/c.height,1.5*DPR);pc.drawImage(c,(pv.width-c.width*s)/2,(pv.height-c.height*s)/2,c.width*s,c.height*s)};
  b.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{S[x.dataset.k]=!S[x.dataset.k];x.classList.toggle('on',S[x.dataset.k]);upd()});
  b.querySelectorAll('[data-al]').forEach(x=>x.onclick=()=>{S.tAlign=x.dataset.al;b.querySelectorAll('[data-al]').forEach(y=>y.classList.toggle('on',y===x));upd()});
  tx.oninput=upd;$('#tFont').onchange=upd;$('#tSize').oninput=upd;
  setTimeout(()=>{upd();tx.focus()},30);

const ptrs=new Map();

  if(e.pointerType==='pen')penSeen=true;

  if(ptrs.size>1||act)return;
  {const gk=e.button===0||e.pointerType!=='mouse'?hitGuide(e):null;if(gk){const g=ensureGuide();act={kind:'guide',k:gk,id:e.pointerId,start:{p:toDoc(e.clientX,e.clientY),r1:{...g.r1},r2:{...g.r2}}};return}}
  if(e.button===1||spaceDown||S.tool==='hand'||(penSeen&&e.pointerType==='touch')){act={kind:'pan',sx:e.clientX,sy:e.clientY,ox:V.x,oy:V.y,id:e.pointerId};view.style.cursor='grabbing';return}
  if(e.button>2)return;
  const alt=e.button===2;const p=toDoc(e.clientX,e.clientY);
  const col=alt?S.secondary:S.primary,col2=alt?S.primary:S.secondary;
  switch(S.tool){
    case 'brush':case 'eraser':beginStroke(p,e,col);break;
    case 'shape':commitFloating();if(!AL().visible){toast('Bu katman gizli');break}stroking=true;strokeOp='source-over';strokeAlpha=S.opacity/100;strokeNeon=false;stx.clearRect(0,0,D.w,D.h);act={kind:'shape',a:p,b:p,col,col2,id:e.pointerId,shift:e.shiftKey};break;
    case 'gradient':commitFloating();if(!AL().visible){toast('Bu katman gizli');break}stroking=true;strokeOp='source-over';strokeAlpha=S.opacity/100;strokeNeon=false;act={kind:'grad',a:p,b:p,col,col2,id:e.pointerId};break;
    case 'fill':doFill(p,col);break;
    case 'picker':pickColor(p,alt);break;
    case 'text':openTextDialog(p,col,col2);break;
    case 'select':selectDown(p,e);break;
  }
});
function selectDown(p,e){
  if(floating){
    const h=hitFloat(e);
    if(h){act={kind:'fh',h,sp:p,f0:{...floating,quad:floating.quad&&floating.quad.map(q=>({...q}))},id:e.pointerId,shift:e.shiftKey};return}
    if(inFloat(p)){act={kind:'fmove',sp:p,x0:floating.x,y0:floating.y,q0:floating.quad&&floating.quad.map(q=>({...q})),id:e.pointerId};return}
    commitFloating();

  if(sel&&!S.selAdd&&inSel(p)){lift();act={kind:'fmove',sp:p,x0:floating.x,y0:floating.y,q0:null,id:e.pointerId};return}
  if(S.selMode==='wand'){const ns=wandSel(p);sel=combineSel(ns);updOpts();dirty();if(!sel)toast('Seçilecek alan bulunamadı');return}
  if(!S.selAdd)sel=null;
  if(S.selMode==='lasso')act={kind:'lasso',pts:[p],id:e.pointerId};

function startPinch(){const [a,b]=[...ptrs.values()];const r=view.getBoundingClientRect();
  act={kind:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top},s0:V.s,x0:V.x,y0:V.y,t0:performance.now(),moved:false}}
function cancelAct(){
  if(!act)return;
  if(act.kind==='stroke'||act.kind==='shape'||act.kind==='grad')cancelStroke();
  if(act.kind==='marquee'||act.kind==='lasso')sel=null;
  act=null;dirty();
}
view.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  const p=toDoc(e.clientX,e.clientY);
  hover={x:p.x,y:p.y,mouse:e.pointerType==='mouse'};
  if(!act){updHud();updCursor(e,p);if(hover.mouse)dirty();return}
  if(act.kind==='pinch'){
    if(ptrs.size<2)return;const [a,b]=[...ptrs.values()];const r=view.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
    const s=clamp(act.s0*d/act.d0,.03,40);
    V.x=m.x-(act.m0.x-act.x0)/act.s0*s;V.y=m.y-(act.m0.y-act.y0)/act.s0*s;V.s=s;
    if(Math.abs(d-act.d0)>12||Math.hypot(m.x-act.m0.x,m.y-act.m0.y)>12)act.moved=true;

    case 'pan':V.x=act.ox+e.clientX-act.sx;V.y=act.oy+e.clientY-act.sy;dirty();break;
    case 'guide':dragGuide(act.k,p,act.start);break;
    case 'stroke':strokeMove(e.getCoalescedEvents?e.getCoalescedEvents():[e]);break;
    case 'shape':act.b=p;act.shift=e.shiftKey;drawShapePreview();break;
    case 'grad':act.b=p;drawGradPreview();break;
    case 'marquee':act.r=normR(act.a,p);dirty();break;
    case 'lasso':{const l=act.pts[act.pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)*V.s>3)act.pts.push({x:clamp(p.x,0,D.w),y:clamp(p.y,0,D.h)});dirty();break}
    case 'fmove':{const dx=p.x-act.sp.x,dy=p.y-act.sp.y;floating.x=Math.round(act.x0+dx);floating.y=Math.round(act.y0+dy);if(act.q0)floating.quad=act.q0.map(q=>({x:q.x+dx,y:q.y+dy}));dirty();break}
    case 'fh':{const f=floating,f0=act.f0,h=act.h;
      if(h[0]==='c'){f.quad[+h[1]]={x:p.x,y:p.y}}
      else if(h==='rot'){const c=fCenter(f);let a=Math.atan2(p.y-c.y,p.x-c.x)+Math.PI/2;if(e.shiftKey)a=Math.round(a/(Math.PI/12))*(Math.PI/12);f.rot=a}
      else if(h==='scale'){const c=fCenter(f0),co=Math.cos(-(f0.rot||0)),si=Math.sin(-(f0.rot||0));const lx=(p.x-c.x)*co-(p.y-c.y)*si,ly=(p.x-c.x)*si+(p.y-c.y)*co;
        let w=Math.max(4,Math.abs(lx-(f0.sk||0)*ly)*2),hh=Math.max(4,Math.abs(ly)*2);if(!e.shiftKey){const k=Math.max(w/f0.w,hh/f0.h);w=f0.w*k;hh=f0.h*k}
        f.w=Math.round(w);f.h=Math.round(hh);f.x=Math.round(c.x-f.w/2);f.y=Math.round(c.y-f.h/2)}
      dirty();break}
  }
  updHud();
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  if(!act)return;
  if(act.kind==='pinch'){
    if(ptrs.size===0){const quick=!act.moved&&performance.now()-act.t0<300;act=null;if(quick){undo();toast('Geri alındı')}}
    return;
  }
  if(act.kind==='none'){if(ptrs.size===0)act=null;return}
  if(e.pointerId!==act.id)return;
  const a=act;
  switch(a.kind){
    case 'stroke':endStroke();break;
    case 'shape':{if(Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y)*V.s<3){cancelStroke();break}commitTemp(a.col);break}
    case 'grad':{if(Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y)*V.s<3){cancelStroke();break}commitTemp(a.col);break}
    case 'marquee':{const ns=a.r&&a.r.w>1&&a.r.h>1?a.r:null;sel=S.selAdd?combineSel(ns)||sel:ns;updOpts();break}
    case 'lasso':{const ns=lassoSel(a.pts);sel=S.selAdd?combineSel(ns)||sel:ns;updOpts();break}
    case 'fh':updOpts();break;
    case 'pan':updCursor(e,toDoc(e.clientX,e.clientY));break;
  }
  act=ptrs.size?{kind:'none'}:null;dirty();
}
view.addEventListener('pointerup',endPointer);view.addEventListener('pointercancel',endPointer);
view.addEventListener('pointerleave',e=>{if(!act){hover=null;dirty();updHud()}});
function updCursor(e,p){
  let c='crosshair';
  if(spaceDown||S.tool==='hand')c='grab';
  else if(S.tool==='text')c='text';
  else if(S.tool==='select'){c='crosshair';const h=hitFloat(e);if(h)c=h==='rot'?'grab':h==='scale'?'nwse-resize':'move';else if(inFloat(p)||(!floating&&!S.selAdd&&inSel(p)))c='move'}
  else if(['brush','eraser'].includes(S.tool)&&e.pointerType==='mouse')c='none';
  view.style.cursor=c;
}
view.addEventListener('wheel',e=>{
  e.preventDefault();const r=view.getBoundingClientRect();
  if(e.shiftKey&&!e.ctrlKey){V.x-=e.deltaY;dirty();return}
  if(!e.ctrlKey&&e.deltaMode===0&&Math.abs(e.deltaX)>Math.abs(e.deltaY)){V.x-=e.deltaX;dirty();return}
  const dy=e.deltaMode===1?e.deltaY*30:e.deltaY;
  zoomAt(Math.exp(-dy*(e.ctrlKey?.01:.0016)),e.clientX-r.left,e.clientY-r.top);

/* ================= KEYBOARD ================= */
const KEYTOOLS={b:'brush',e:'eraser',g:'fill',r:'gradient',i:'picker',t:'text',u:'shape',m:'select',v:'select',h:'hand'};
window.addEventListener('keydown',e=>{
  const tg=document.activeElement&&document.activeElement.tagName;
  const modalOpen=$('#modal').classList.contains('show');
  if(e.key==='Escape'){if(modalOpen){closeDialog();return}if(floating){cancelFloating();return}if(sel){deselect();return}if(document.body.parentElement&&$('#app').classList.contains('side-open')&&innerWidth<1000){toggleSide(false)}return}
  if(modalOpen||/INPUT|TEXTAREA|SELECT/.test(tg))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(k==='y'){e.preventDefault();redo()}
    else if(k==='c'){e.preventDefault();copySel()}
    else if(k==='x'){e.preventDefault();cutSel()}
    else if(k==='a'){e.preventDefault();selectAll()}
    else if(k==='d'){e.preventDefault();deselect()}
    else if(k==='i'){e.preventDefault();invertSel()}
    else if(k==='g'){e.preventDefault();galleryDialog()}
    else if(k==='s'){e.preventDefault();exportDialog()}
    else if(k==='o'){e.preventDefault();fileIn.click()}
    else if(k==='n'&&e.shiftKey){e.preventDefault();addLayer()}
    else if(k==='0'){e.preventDefault();fit()}
    else if(k==='1'){e.preventDefault();zoomTo(1)}
    return;
  }
  if(e.key===' '){if(!spaceDown){spaceDown=true;view.style.cursor='grab'}e.preventDefault();return}
  if(KEYTOOLS[k]){setTool(KEYTOOLS[k]);return}
  if(k==='l'){S.shape='line';setTool('shape');return}
  if(k==='o'){S.shape='ellipse';setTool('shape');return}
  if(k==='x'){swapColors();return}
  if(k==='['){S.size=clamp(Math.round(S.size/1.15)-(S.size<8?1:0),1,300);updOpts();dirty();return}
  if(k===']'){S.size=clamp(Math.round(S.size*1.15)+(S.size<8?1:0),1,300);updOpts();dirty();return}
  if(k==='+'||k==='='){zoomTo(V.s*1.25);return}
  if(k==='-'){zoomTo(V.s/1.25);return}
  if(k==='0'){fit();return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return}
  if(e.key==='Enter'){commitFloating();return}
  if(/^[1-9]$/.test(k)){S.opacity=+k*10;updOpts();return}
  if(e.key==='?'){helpDialog();return}
});
window.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;view.style.cursor='crosshair'}});
window.addEventListener('blur',()=>{spaceDown=false});

/* ================= EFFECTS & CANVAS OPS ================= */
function fxRegion(){return sel||{x:0,y:0,w:D.w,h:D.h}}
function fxMaskBlend(L,r,orig){ // seçim maskesi dışını eski haline döndür
  if(!r.mask)return;const t=mk(r.w,r.h),tx=t.getContext('2d');tx.drawImage(L.canvas,r.x,r.y,r.w,r.h,0,0,r.w,r.h);tx.globalCompositeOperation='destination-in';tx.drawImage(r.mask,0,0);
  const o=mk(r.w,r.h),ox=o.getContext('2d');ox.putImageData(orig,0,0);ox.globalCompositeOperation='destination-out';ox.drawImage(r.mask,0,0);
  L.ctx.clearRect(r.x,r.y,r.w,r.h);L.ctx.drawImage(o,r.x,r.y);L.ctx.drawImage(t,r.x,r.y);
}
function applyFx(name){
  commitFloating();const L=AL();const r=fxRegion();if(r.w<1||r.h<1)return;pushL(L);
  const orig=r.mask?L.ctx.getImageData(r.x,r.y,r.w,r.h):null;
  if(name==='pixel'){const b=Math.max(4,Math.round(Math.min(D.w,D.h)/70));const sw=Math.ceil(r.w/b),sh=Math.ceil(r.h/b);const t=mk(sw,sh),tx=t.getContext('2d');tx.drawImage(L.canvas,r.x,r.y,r.w,r.h,0,0,sw,sh);
    L.ctx.save();L.ctx.beginPath();L.ctx.rect(r.x,r.y,r.w,r.h);L.ctx.clip();L.ctx.clearRect(r.x,r.y,r.w,r.h);L.ctx.imageSmoothingEnabled=false;L.ctx.drawImage(t,0,0,sw,sh,r.x,r.y,sw*b,sh*b);L.ctx.restore();
    if(orig)fxMaskBlend(L,r,orig);afterChange(L);return}
  if(name==='flipLH'||name==='flipLV'){const t=mk(r.w,r.h);t.getContext('2d').drawImage(L.canvas,r.x,r.y,r.w,r.h,0,0,r.w,r.h);L.ctx.save();L.ctx.clearRect(r.x,r.y,r.w,r.h);
    if(name==='flipLH'){L.ctx.translate(r.x+r.w,r.y);L.ctx.scale(-1,1)}else{L.ctx.translate(r.x,r.y+r.h);L.ctx.scale(1,-1)}L.ctx.drawImage(t,0,0);L.ctx.restore();if(orig)fxMaskBlend(L,r,orig);afterChange(L);return}
  const img=L.ctx.getImageData(r.x,r.y,r.w,r.h),d=img.data,n=d.length;
  const lut=f=>{for(let i=0;i<n;i+=4){d[i]=f(d[i]);d[i+1]=f(d[i+1]);d[i+2]=f(d[i+2])}};
  switch(name){
    case 'gray':for(let i=0;i<n;i+=4){const v=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i]=d[i+1]=d[i+2]=v}break;
    case 'invert':lut(v=>255-v);break;
    case 'sepia':for(let i=0;i<n;i+=4){const r0=d[i],g0=d[i+1],b0=d[i+2];d[i]=r0*.393+g0*.769+b0*.189;d[i+1]=r0*.349+g0*.686+b0*.168;d[i+2]=r0*.272+g0*.534+b0*.131}break;
    case 'bright':lut(v=>v+28);break;
    case 'dark':lut(v=>v-28);break;
    case 'contrast':lut(v=>(v-128)*1.25+128);break;
    case 'sat':for(let i=0;i<n;i+=4){const g=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i]=g+(d[i]-g)*1.4;d[i+1]=g+(d[i+1]-g)*1.4;d[i+2]=g+(d[i+2]-g)*1.4}break;
    case 'poster':lut(v=>Math.round(v/255*4)*255/4);break;
    case 'noise':for(let i=0;i<n;i+=4){const k=(Math.random()-.5)*50;d[i]+=k;d[i+1]+=k;d[i+2]+=k}break;
    case 'blur':blur(d,r.w,r.h,2);blur(d,r.w,r.h,2);break;
    case 'sharpen':conv(d,r.w,r.h,[0,-1,0,-1,5,-1,0,-1,0]);break;
    case 'emboss':conv(d,r.w,r.h,[-2,-1,0,-1,1,1,0,1,2]);break;
    case 'edges':conv(d,r.w,r.h,[-1,-1,-1,-1,8,-1,-1,-1,-1]);break;
  }
  L.ctx.putImageData(img,r.x,r.y);if(orig)fxMaskBlend(L,r,orig);afterChange(L);
}
function blur(d,w,h,rad){
  // premultiplied separable box blur on all channels
  const t=new Float32Array(d.length);
  for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;t[i]=d[i]*a;t[i+1]=d[i+1]*a;t[i+2]=d[i+2]*a;t[i+3]=d[i+3]}
  const u=new Float32Array(d.length);
  const pass=(src,dst,horiz)=>{const L=horiz?w:h,M=horiz?h:w;for(let m=0;m<M;m++){for(let l=0;l<L;l++){let s0=0,s1=0,s2=0,s3=0,c=0;for(let k=-rad;k<=rad;k++){const q=clamp(l+k,0,L-1);const idx=(horiz?(m*w+q):(q*w+m))*4;s0+=src[idx];s1+=src[idx+1];s2+=src[idx+2];s3+=src[idx+3];c++}const o=(horiz?(m*w+l):(l*w+m))*4;dst[o]=s0/c;dst[o+1]=s1/c;dst[o+2]=s2/c;dst[o+3]=s3/c}}};
  pass(t,u,true);pass(u,t,false);
  for(let i=0;i<d.length;i+=4){const a=t[i+3]/255;d[i+3]=t[i+3];if(a>0){d[i]=t[i]/a;d[i+1]=t[i+1]/a;d[i+2]=t[i+2]/a}}
}
function conv(d,w,h,k){const s=new Uint8ClampedArray(d);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let r=0,g=0,b=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const q=(clamp(y+j,0,h-1)*w+clamp(x+i,0,w-1))*4,kk=k[(j+1)*3+i+1];r+=s[q]*kk;g+=s[q+1]*kk;b+=s[q+2]*kk}const o=(y*w+x)*4;d[o]=r;d[o+1]=g;d[o+2]=b}}
function rotateDoc(dir){commitFloating();pushD();D.layers.forEach(L=>{const c=mk(D.h,D.w),x=c.getContext('2d');if(dir>0){x.translate(D.h,0);x.rotate(Math.PI/2)}else{x.translate(0,D.w);x.rotate(-Math.PI/2)}x.drawImage(L.canvas,0,0);L.canvas=c;L.ctx=x;x.setTransform(1,0,0,1,0,0)});[D.w,D.h]=[D.h,D.w];resetAux();fit();afterChange()}
function flipDoc(h){commitFloating();pushD();D.layers.forEach(L=>{const c=mk(D.w,D.h),x=c.getContext('2d');if(h){x.translate(D.w,0);x.scale(-1,1)}else{x.translate(0,D.h);x.scale(1,-1)}x.drawImage(L.canvas,0,0);x.setTransform(1,0,0,1,0,0);L.canvas=c;L.ctx=x});resetAux();afterChange()}
function resizeDoc(nw,nh,mode){commitFloating();pushD();D.layers.forEach((L,i)=>{const c=mk(nw,nh),x=c.getContext('2d');if(mode==='scale'){x.imageSmoothingQuality='high';x.drawImage(L.canvas,0,0,nw,nh)}else{if(i===0&&mode==='extend'){x.fillStyle='#fff';x.fillRect(0,0,nw,nh)}x.drawImage(L.canvas,Math.round((nw-D.w)/2),Math.round((nh-D.h)/2))}L.canvas=c;L.ctx=x});D.w=nw;D.h=nh;resetAux();fit();afterChange()}

function dialog(title,body,buttons){
  const m=$('#modal');m.innerHTML='';const d=el('div','dlg');
  d.innerHTML=`<h3>${title}<button title="Kapat">✕</button></h3><div class="body">${body}</div>`;
  d.querySelector('h3 button').onclick=closeDialog;
  if(buttons&&buttons.length){const f=el('div','foot');buttons.forEach(b=>{const x=el('button','btn '+(b.c||''),b.t);x.onclick=()=>{if(b.fn&&b.fn()===false)return;closeDialog()};f.appendChild(x)});d.appendChild(f)}
  m.appendChild(d);m.classList.add('show');m.onclick=e=>{if(e.target===m)closeDialog()};return d;
}

function outData(fmt){
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const ad=`cizim-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.${fmt==='jpeg'?'jpg':'png'}`;
  const url=flatten(fmt==='jpeg').toDataURL('image/'+fmt,.92);
  return{ad,tip:'image/'+fmt,b64:url.slice(url.indexOf(',')+1)};
}

const BGT=[['white','Düz beyaz'],['lined','Çizgili defter'],['grid','Kareli'],['dots','Noktalı'],['iso','İzometrik'],['canvas','Kanvas dokusu'],['paper','Kağıt dokusu'],['kraft','Kraft kağıt'],['chalk','Kara tahta'],['sky','Gökyüzü']];
function drawBgTemplate(x,w,h,t){

  switch(t){
    case 'white':x.fillStyle='#fff';x.fillRect(0,0,w,h);break;
    case 'lined':{x.fillStyle='#fffef8';x.fillRect(0,0,w,h);x.strokeStyle='#b7d3f2';x.lineWidth=Math.max(1,u/18);x.beginPath();for(let y=u*2.2;y<h;y+=u*1.15){x.moveTo(0,y);x.lineTo(w,y)}x.stroke();
      x.strokeStyle='#f19a9a';x.lineWidth=Math.max(1.5,u/12);x.beginPath();x.moveTo(u*2.4,0);x.lineTo(u*2.4,h);x.stroke();break}
    case 'grid':{x.fillStyle='#fff';x.fillRect(0,0,w,h);const s=u*.9;x.strokeStyle='#cfe0f3';x.lineWidth=Math.max(1,u/22);x.beginPath();for(let X=s;X<w;X+=s){x.moveTo(X,0);x.lineTo(X,h)}for(let Y=s;Y<h;Y+=s){x.moveTo(0,Y);x.lineTo(w,Y)}x.stroke();
      x.strokeStyle='#a9c6e8';x.beginPath();for(let X=s*5;X<w;X+=s*5){x.moveTo(X,0);x.lineTo(X,h)}for(let Y=s*5;Y<h;Y+=s*5){x.moveTo(0,Y);x.lineTo(w,Y)}x.stroke();break}
    case 'dots':{x.fillStyle='#fff';x.fillRect(0,0,w,h);const s=u*.9;x.fillStyle='#b9c3cf';for(let X=s;X<w;X+=s)for(let Y=s;Y<h;Y+=s){x.beginPath();x.arc(X,Y,Math.max(1,u/14),0,Math.PI*2);x.fill()}break}
    case 'iso':{x.fillStyle='#fff';x.fillRect(0,0,w,h);const s=u*1.2;x.strokeStyle='#d5dff0';x.lineWidth=Math.max(1,u/22);x.beginPath();const k=Math.tan(Math.PI/6);
      for(let X=-h/k;X<w+h/k;X+=s/k){x.moveTo(X,0);x.lineTo(X+h/k,h);x.moveTo(X,0);x.lineTo(X-h/k,h)}for(let X=0;X<w;X+=s/k*1){}x.stroke();break}
    case 'canvas':{x.fillStyle='#f4efe4';x.fillRect(0,0,w,h);x.globalAlpha=.08;x.strokeStyle='#6b5b3e';x.lineWidth=1;const s=Math.max(2,u/9);x.beginPath();for(let Y=0;Y<h;Y+=s){x.moveTo(0,Y+rnd(1));x.lineTo(w,Y+rnd(1))}x.stroke();
      x.globalAlpha=.06;x.beginPath();for(let X=0;X<w;X+=s){x.moveTo(X+rnd(1),0);x.lineTo(X+rnd(1),h)}x.stroke();x.globalAlpha=1;noise(.25,40,true);break}
    case 'paper':{x.fillStyle='#fbf8f1';x.fillRect(0,0,w,h);noise(.35,22,true);x.globalAlpha=.05;x.strokeStyle='#8a7a5a';for(let i=0;i<w*h/9000;i++){const a=rnd(Math.PI*2),X=rnd(w),Y=rnd(h),l=rnd(u*.6);x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);x.stroke()}break}
    case 'kraft':{x.fillStyle='#c9a678';x.fillRect(0,0,w,h);noise(.5,45,true);x.globalAlpha=.08;x.strokeStyle='#5e4424';for(let i=0;i<w*h/6000;i++){const a=rnd(Math.PI*2),X=rnd(w),Y=rnd(h),l=rnd(u*.8);x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);x.stroke()}break}
    case 'chalk':{const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.7);g.addColorStop(0,'#2f4a3c');g.addColorStop(1,'#1b2c24');x.fillStyle=g;x.fillRect(0,0,w,h);noise(.3,20,false);x.lineWidth=u*.5;x.strokeStyle='#6b4a2b';x.strokeRect(u*.25,u*.25,w-u*.5,h-u*.5);break}

  }
  x.restore();
}

/* Kare çizen bir fonksiyondan video kaydeder: drawFrame(ctx,i) → i. kare; n kare, fps hızında */
async function recordVideo(w,h,n,fps,drawFrame,onProg){
  const mime=pickMime();if(!mime)throw new Error('Bu cihaz video kaydını desteklemiyor');
  w=w&~1;h=h&~1;const c=mk(w,h),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const st=c.captureStream(fps),rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:6e6}),parts=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);rec.start(250);
  const t0=performance.now();
  for(let i=0;i<n;i++){await drawFrame(x,i,w,h);onProg&&onProg(i/n);const due=t0+(i+1)*1000/fps,wait=due-performance.now();await new Promise(r=>setTimeout(r,Math.max(0,wait)))}
  await new Promise(r=>setTimeout(r,300));rec.stop();await done;st.getTracks().forEach(t=>t.stop());
  return{blob:new Blob(parts,{type:mime.split(';')[0]}),ext:mime.includes('mp4')?'mp4':'webm',mime:mime.split(';')[0]};
}

      const bytes=await gifEncode(datas,w,h,Math.round(100/ANIM.fps),f=>prog(.5+f*.5,'GIF kodlanıyor… %'+Math.round(50+f*50)));
      closeDialog();mediaResultDialog('🎞️ Animasyon (GIF)',new Blob([bytes],{type:'image/gif'}),'gif','image/gif','animasyon');
    }else{
      const cs=[];for(let k=1;k<=n;k++)cs.push(frame(k));
      const r=await recordVideo(w,h,n*loops,ANIM.fps,(x,i)=>{x.drawImage(cs[i%n],0,0)},f=>prog(f,'Kaydediliyor… %'+Math.round(f*100)));
      closeDialog();mediaResultDialog('🎞️ Animasyon (video)',r.blob,r.ext,r.mime,'animasyon');
    }
  }catch(e){closeDialog();toast('Oluşturulamadı: '+e.message)}
}
/* --- GIF kodlayıcı (6×7×6 renk küpü + sıralı titreme, LZW) --- */
async function gifEncode(frames,w,h,delay,onProg){
  const out=[];const wb=b=>out.push(b&255),w16=v=>{wb(v);wb(v>>8)},str=s=>{for(const ch of s)wb(ch.charCodeAt(0))};
  str('GIF89a');w16(w);w16(h);wb(0xF7);wb(0);wb(0);
  for(let i=0;i<256;i++){if(i<252){const r=Math.floor(i/42),g=Math.floor(i/6)%7,b=i%6;wb(Math.round(r*51));wb(Math.round(g*42.5));wb(Math.round(b*51))}else{wb(0);wb(0);wb(0)}}
  wb(0x21);wb(0xFF);wb(11);str('NETSCAPE2.0');wb(3);wb(1);w16(0);wb(0);
  const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v/16-.5));
  const idx=new Uint8Array(w*h),tab=new Int32Array(4096*256);
  for(let f=0;f<frames.length;f++){
    const d=frames[f].data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=(y*w+x)*4,t=B[(y&3)*4+(x&3)];
      const r=clamp(Math.round(d[p]/51+t),0,5),g=clamp(Math.round(d[p+1]/42.5+t),0,6),b=clamp(Math.round(d[p+2]/51+t),0,5);idx[y*w+x]=r*42+g*6+b}
    wb(0x21);wb(0xF9);wb(4);wb(0x04);w16(Math.max(2,delay));wb(0);wb(0);
    wb(0x2C);w16(0);w16(0);w16(w);w16(h);wb(0);
    lzwEncode(idx,8,wb,tab);
    onProg&&onProg((f+1)/frames.length);await new Promise(r=>setTimeout(r,0));
  }
  wb(0x3B);return new Uint8Array(out);
}
function lzwEncode(ind,minSize,wb,tab){
  wb(minSize);const clear=1<<minSize,eoi=clear+1;let size=minSize+1,maxc=(1<<size)-1,next=eoi+1,clr=false,cur=0,bits=0;const bytes=[];
  tab.fill(0);
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){bytes.push(cur&255);cur>>>=8;bits-=8}
    if(clr){size=minSize+1;maxc=(1<<size)-1;clr=false}else if(next>maxc&&size<12){size++;maxc=size===12?4096:(1<<size)-1}};
  emit(clear);let pre=ind[0];
  for(let i=1;i<ind.length;i++){const k=ind[i],key=pre*256+k,v=tab[key];
    if(v){pre=v-1;continue}
    emit(pre);
    if(next<4096){tab[key]=next+1;next++}else{tab.fill(0);next=eoi+1;clr=true;emit(clear)}
    pre=k}
  emit(pre);emit(eoi);if(bits>0)bytes.push(cur&255);
  for(let i=0;i<bytes.length;i+=255){const n=Math.min(255,bytes.length-i);wb(n);for(let j=0;j<n;j++)wb(bytes[i+j])}
  wb(0);
}
