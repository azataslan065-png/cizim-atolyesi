<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Çizim Atölyesi</title>
<style>
:root{--bg:#17191d;--panel:#23262c;--panel2:#2c3038;--line:#383d47;--txt:#e9eaee;--mut:#9aa1ad;--acc:#4f9dff;--accbg:#1f3552;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
svg{display:block}
#app{display:grid;height:100%;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "tools stage side"}
/* ---- top bar ---- */
#top{grid-area:top;display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;flex-wrap:nowrap}
.grp{display:flex;align-items:center;gap:2px;flex-shrink:0}
.brand{font-weight:700;letter-spacing:.2px;padding:0 8px 0 4px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand i{width:20px;height:20px;border-radius:6px;background:conic-gradient(#ff5252,#ffb300,#66bb6a,#29b6f6,#ab47bc,#ff5252);display:inline-block}
#opts{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 4px}
#opts::-webkit-scrollbar{display:none}
.ib{width:40px;height:40px;border-radius:var(--r);border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--panel2)}
.ib:active{background:var(--line)}
.ib.on{background:var(--accbg);border-color:var(--acc);color:#a9d0ff}
.ib:disabled{opacity:.3;pointer-events:none}
/* ---- tools ---- */
#tools{grid-area:tools;display:flex;flex-direction:column;gap:3px;padding:6px 5px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;align-items:center}
#tools::-webkit-scrollbar{display:none}
#tools .ib{width:44px;height:44px}
#tools .ib svg{width:23px;height:23px}
#tools .sep{width:28px;height:1px;background:var(--line);margin:3px 0;flex-shrink:0}
/* ---- stage ---- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:#2b2e35;min-width:0;min-height:0}
#view{position:absolute;left:0;top:0;touch-action:none;outline:none}
#hud{position:absolute;left:8px;bottom:8px;background:#000a;color:#dde;font-size:12px;padding:4px 9px;border-radius:14px;pointer-events:none;white-space:nowrap}
#zoomCtl{position:absolute;right:8px;bottom:8px;display:flex;gap:2px;background:#000a;border-radius:14px;padding:2px}
#zoomCtl button{background:transparent;border:0;height:30px;min-width:30px;border-radius:12px;cursor:pointer;padding:0 6px;font-size:13px}
#zoomCtl button:hover{background:#fff2}
#zoomCtl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
/* ---- side ---- */
#side{grid-area:side;width:292px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;background:transparent;border:0;padding:11px 0;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:600}
.tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
.tabs .x{flex:0 0 44px;font-size:18px}
.pane{flex:1;overflow-y:auto;padding:12px;display:none;min-height:0}
.pane.on{display:block}
#scrim{position:fixed;inset:0;background:#0007;z-index:25;display:none}
@media (min-width:1000px){#app:not(.side-open) #side{display:none}}
@media (max-width:999px){
  #side{position:fixed;right:0;top:0;bottom:0;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 30px #0008}
  #app.side-open #side{transform:none}
  #app.side-open #scrim{display:block}
}
/* portrait phones / tablets */
@media (orientation:portrait) and (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "stage" "tools"}
  #top{flex-wrap:wrap;row-gap:4px}
  #opts{order:3;flex-basis:100%;padding:2px 0 0;border-top:1px solid var(--line);padding-top:5px}
  #top>.grp:first-child{flex:1 1 0;min-width:0}
  .brand{flex:1;min-width:0;overflow:hidden}
  .brand span{overflow:hidden;text-overflow:ellipsis}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
  #tools .sep{width:1px;height:28px;margin:0 3px}
  #side{top:auto;left:0;bottom:0;right:0;width:auto;height:64vh;border-radius:16px 16px 0 0;transform:translateY(105%);border-left:0;border-top:1px solid var(--line)}
}
/* landscape phones (short height) */
@media (orientation:landscape) and (max-height:560px){
  #top{padding:2px 4px}
  .ib{width:36px;height:36px}
  #tools{padding:3px;gap:1px}
  #tools .ib{width:36px;height:34px}
  #tools .ib svg{width:20px;height:20px}
  #tools .sep{display:none}
  .brand span{display:none}
  #side{width:300px}
  .pane{padding:8px}
  #hud{display:none}
}
@media (max-width:420px){.brand span{font-size:13px}}
/* ---- options widgets ---- */
.cpair{position:relative;width:46px;height:40px;flex-shrink:0}
.cpair .c{position:absolute;width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px #0008;cursor:pointer}
.cpair .c.p{left:2px;top:2px;z-index:2}
.cpair .c.s{left:16px;top:12px}
.cpair .sw{position:absolute;right:-4px;top:-2px;font-size:11px;cursor:pointer;color:var(--mut);background:none;border:0;padding:2px}
.osep{width:1px;height:26px;background:var(--line);flex-shrink:0}
.chips{display:flex;gap:3px;flex-shrink:0}
.chip{height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;font-size:13px;flex-shrink:0}
.chip.ic{width:34px;padding:0;justify-content:center}
.chip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:var(--accbg);border-color:var(--acc);color:#cfe4ff}
.chip.go{background:#1f6f3f;border-color:#2e9c5a}
.chip.no{background:#5a2626;border-color:#8b3a3a}
.sl{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:12px;color:var(--mut)}
.sl input[type=range]{width:96px;accent-color:var(--acc)}
.sl b{min-width:28px;color:var(--txt);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.osel{height:32px;border-radius:8px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:0 6px;flex-shrink:0}
.info{font-size:12px;color:var(--mut);white-space:nowrap}
/* ---- color pane ---- */
.bigpair{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bigsw{flex:1;height:44px;border-radius:10px;border:2px solid var(--line);cursor:pointer;position:relative;background-clip:padding-box}
.bigsw.on{border-color:var(--acc);box-shadow:0 0 0 2px #4f9dff55}
.bigsw span{position:absolute;left:6px;bottom:-18px;font-size:11px;color:var(--mut)}
#svBox,#hueBar,#aBar{width:100%;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#svBox{height:170px;margin-top:14px}
#hueBar,#aBar{height:18px;margin-top:10px}
.hexrow{display:flex;gap:6px;margin-top:10px;align-items:center}
.hexrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.lbl{font-size:11px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.pal div{aspect-ratio:1;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px #0005}
.pal div:hover{transform:scale(1.1)}
/* ---- layers pane ---- */
.lbtns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.lbtns .ib{width:38px;height:36px;background:var(--panel2)}
.lbtns .ib svg{width:18px;height:18px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:4px;background:var(--panel2)}
.lrow.on{border-color:var(--acc);background:var(--accbg)}
.lrow canvas{width:56px;height:42px;border-radius:5px;background:#fff;flex-shrink:0;box-shadow:0 0 0 1px #0006}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;color:var(--mut);font-size:11px}
.lrow .eye{width:34px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.lrow .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.lrow.hid .nm,.lrow.hid canvas{opacity:.4}
.lprops{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.prow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}
.prow input[type=range]{flex:1;accent-color:var(--acc)}
.prow select{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.dlg h3{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg h3 button{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);padding:0 4px}
.dlg .body{padding:14px 16px;overflow-y:auto;user-select:text;-webkit-user-select:text}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.g{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.d{background:#c62828}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--mut)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px}
.field textarea{min-height:80px;resize:vertical}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#outImg{max-width:100%;max-height:48vh;display:block;margin:0 auto 10px;border-radius:8px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.note{font-size:13px;color:var(--mut);text-align:center;margin:0}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.menu h4{grid-column:1/-1;margin:10px 0 2px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.menu h4:first-child{margin-top:0}
.menu button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font-size:13px}
.menu button:hover{border-color:var(--acc)}
.menu button kbd{float:right;color:var(--mut);font-size:11px;font-family:inherit}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.keys kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit;font-size:12px;white-space:nowrap;justify-self:start}
#textPrev{width:100%;height:90px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:8px;margin-bottom:12px;display:block}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000e;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="grp">
      <button class="ib" id="bMenu" title="Menü"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="brand"><i></i><span>Çizim Atölyesi</span></div>
      <button class="ib" id="bUndo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
      <button class="ib" id="bRedo" title="Yinele (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
    </div>
    <div id="opts"></div>
    <div class="grp">
      <button class="ib" id="bColor" title="Renk paneli"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1 0 1.5-.8 1.5-1.5 0-1-.8-1.3-.8-2.2 0-.9.7-1.5 1.6-1.5H16a5 5 0 005-5c0-4.4-4-7.8-9-7.8z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></button>
      <button class="ib" id="bLayers" title="Katmanlar"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
      <button class="ib" id="bSave" title="Kaydet / Dışa aktar (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></button>
    </div>
  </header>
  <nav id="tools"></nav>
  <main id="stage">
    <canvas id="view" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="zoomCtl">
      <button id="zOut" title="Uzaklaştır (-)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zPct" title="%100">100%</button>
      <button id="zIn" title="Yakınlaştır (+)"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <button id="zFit" title="Ekrana sığdır (0)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </main>
  <aside id="side">
    <div class="tabs"><button data-tab="color" class="on">Renk</button><button data-tab="layers">Katmanlar</button><button class="x" id="sideX" title="Kapat">✕</button></div>
    <section class="pane on" id="pColor">
      <div class="bigpair">
        <div class="bigsw on" id="bigP"><span>Ana renk</span></div>
        <button class="ib" id="bigSwap" title="Renkleri değiştir (X)"><svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg></button>
        <div class="bigsw" id="bigS"><span>İkinci renk</span></div>
      </div>
      <canvas id="svBox"></canvas>
      <canvas id="hueBar"></canvas>
      <div class="hexrow"><input id="hexIn" maxlength="7" spellcheck="false"><button class="btn g" id="eyeBtn" title="Tuvalden renk al">Damlalık</button></div>
      <div class="lbl">Palet</div>
      <div class="pal" id="pal"></div>
      <div class="lbl">Son kullanılanlar</div>
      <div class="pal" id="recent"></div>
      <p class="note" style="text-align:left;margin-top:12px;font-size:12px">İpucu: Farede sağ tık ikinci renkle çizer. Palette sağ tık ikinci rengi seçer.</p>
    </section>
    <section class="pane" id="pLayers">
      <div class="lbtns">
        <button class="ib" id="lAdd" title="Yeni katman"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" id="lDup" title="Katmanı çoğalt"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg></button>
        <button class="ib" id="lUp" title="Yukarı taşı"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button class="ib" id="lDown" title="Aşağı taşı"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
        <button class="ib" id="lMerge" title="Alttakiyle birleştir"><svg viewBox="0 0 24 24"><path d="M7 4v5a5 5 0 005 5 5 5 0 015 5v1"/><path d="M17 4v5a5 5 0 01-3 4.6"/><path d="M14 17l3 3 3-3"/></svg></button>
        <button class="ib" id="lClear" title="Katmanı temizle"><svg viewBox="0 0 24 24"><path d="M7 21h13"/><path d="M5 15l9-9 6 6-7 7H8z"/></svg></button>
        <button class="ib" id="lDel" title="Katmanı sil"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <div id="layerList"></div>
      <div class="lprops">
        <div class="prow">Opaklık <input type="range" id="lOp" min="0" max="100"><b id="lOpV" style="min-width:34px;color:var(--txt)">100</b></div>
        <div class="prow">Karışım <select id="lBlend">
          <option value="source-over">Normal</option><option value="multiply">Çarpma</option><option value="screen">Ekran</option><option value="overlay">Kaplama</option><option value="darken">Koyulaştır</option><option value="lighten">Açıklaştır</option><option value="color-dodge">Renk soldurma</option><option value="color-burn">Renk yakma</option><option value="difference">Fark</option><option value="hue">Ton</option><option value="color">Renk</option>
        </select></div>
        <div class="prow"><button class="btn g" id="lRename" style="flex:1">Yeniden adlandır</button></div>
      </div>
    </section>
  </aside>
  <div id="scrim"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DPR=Math.min(window.devicePixelRatio||1,2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const cloneC=c=>{const n=mk(c.width,c.height);n.getContext('2d').drawImage(c,0,0);return n};
const el=(t,cls,html)=>{const e=document.createElement(t);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=1;

/* ================= ICONS ================= */
const IC={
 select:'<path d="M4 8V5a1 1 0 011-1h3M14 4h2M20 8V5a1 1 0 00-1-1h-1M4 14v2M4 20v-1M20 14v2M8 20h2M14 20h1" /><path d="M13 13l7 3-3 1-1 3z"/>',
 hand:'<path d="M8 13V5.5a1.5 1.5 0 013 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 013 0V11"/><path d="M14 10.5V6a1.5 1.5 0 013 0v5"/><path d="M17 9.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1.5a6 6 0 01-4.6-2.2L5 15.5a1.6 1.6 0 012.4-2.1L8 14"/>',
 brush:'<path d="M18 3l3 3-9.5 9.5-3-3z"/><path d="M8.5 12.5C5 12.5 4 15 4 17s-1 3-2 3c3 1 7 0 8-3.5"/>',
 eraser:'<path d="M7 21h13"/><path d="M5 15l9-9 6 6-7 7H8z"/><path d="M9 11l6 6"/>',
 fill:'<path d="M5 11l7-7 7 7-7 7z"/><path d="M5 11h14"/><path d="M20 15s2 2.5 2 4a2 2 0 01-4 0c0-1.5 2-4 2-4z"/>',
 gradient:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l12-12M3 21L21 3M9 21l12-12" opacity=".5"/>',

function fit(){const pad=Math.min(28,SW*.04);V.s=Math.min((SW-pad*2)/D.w,(SH-pad*2)/D.h);if(!isFinite(V.s)||V.s<=0)V.s=1;V.x=(SW-D.w*V.s)/2;V.y=(SH-D.h*V.s)/2;dirty();updHud()}

let needs=false;function dirty(){if(!needs){needs=true;requestAnimationFrame(render)}}
const checker=(()=>{const c=mk(16,16),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,16,16);x.fillStyle='#d5d8dc';x.fillRect(0,0,8,8);x.fillRect(8,8,8,8);return c})();

    if(!L.visible)return;

      scx.globalCompositeOperation='source-over';scx.globalAlpha=1;

  }

    const cx=D.w/2,cy=D.h/2;
    if(S.sym==='v'||S.sym==='4'){c.moveTo(cx,0);c.lineTo(cx,D.h)}
    if(S.sym==='h'||S.sym==='4'){c.moveTo(0,cy);c.lineTo(D.w,cy)}
    if(S.sym==='r6'||S.sym==='r8'){const n=S.sym==='r6'?6:8,R=Math.hypot(D.w,D.h);for(let k=0;k<n;k++){const a=k*Math.PI*2/n-Math.PI/2;c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R)}}

    c.restore();
    if(floating){const hr=10/V.s;c.fillStyle='#4f9dff';c.strokeStyle='#fff';c.lineWidth=2*lw;

    const r=Math.max(1,bw()/2);c.beginPath();c.arc(hover.x,hover.y,r,0,Math.PI*2);
    c.lineWidth=lw;c.strokeStyle='rgba(0,0,0,.7)';c.stroke();c.beginPath();c.arc(hover.x,hover.y,r+lw,0,Math.PI*2);c.strokeStyle='rgba(255,255,255,.8)';c.stroke();
  }
}

/* ================= SYMMETRY ================= */
function symMats(){
  const cx=D.w/2,cy=D.h/2,I=[1,0,0,1,0,0];
  switch(S.sym){
    case 'v':return[I,[-1,0,0,1,2*cx,0]];
    case 'h':return[I,[1,0,0,-1,0,2*cy]];
    case '4':return[I,[-1,0,0,1,2*cx,0],[1,0,0,-1,0,2*cy],[-1,0,0,-1,2*cx,2*cy]];
    case 'r6':case 'r8':{const n=S.sym==='r6'?6:8,m=[];for(let k=0;k<n;k++){const a=k*Math.PI*2/n,co=Math.cos(a),si=Math.sin(a);m.push([co,si,-si,co,cx-co*cx+si*cy,cy-si*cx-co*cy])}return m}
  }

}
function eachSym(c,fn){const ms=S.tool==='gradient'?[[1,0,0,1,0,0]]:symMats();for(const m of ms){c.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);fn()}c.setTransform(1,0,0,1,0,0)}

/* ================= BRUSHES ================= */
function bw(){const b=S.tool==='eraser'?'round':S.brush;let w=S.size;if(b==='pencil')w=Math.max(1,S.size*.35);if(b==='marker')w=S.size*1.6;return w}

  const b=S.tool==='eraser'?'eraser':S.brush;
  strokeOp=b==='eraser'?'destination-out':(b==='marker'?'multiply':'source-over');
  strokeAlpha=S.opacity/100*(b==='marker'?.55:1);

  act={kind:'stroke',b,col,last:p,raw:p,mid:p,pr:pressure(e),hue:Math.random()*360,id:e.pointerId,timer:null};

function seg(a,ctrl,b,first){
  const A=act,w=bw()*(A.pr<1?(.15+.85*A.pr):1),col=A.col;

  switch(A.b){
    case 'round':case 'pencil':case 'marker':case 'eraser':
      eachSym(stx,()=>{
        stx.strokeStyle=stx.fillStyle=A.b==='eraser'?'#000':col;
        if(first){stx.beginPath();stx.arc(a.x,a.y,w/2,0,Math.PI*2);stx.fill();return}
        stx.lineWidth=w;stx.beginPath();stx.moveTo(a.x,a.y);stx.quadraticCurveTo(ctrl.x,ctrl.y,b.x,b.y);stx.stroke();

          for(let j=0;j<k;j++){const ang=Math.random()*Math.PI*2,d=Math.random()*w/2;const s=Math.random()*1.6+.6;stx.globalAlpha=.35+Math.random()*.65;stx.fillRect(x+Math.cos(ang)*d,y+Math.sin(ang)*d,s,s)}}

function spray(p,len){

function strokeMove(evs){

function cancelStroke(){if(act&&act.timer)clearInterval(act.timer);stroking=false;stx.clearRect(0,0,D.w,D.h);stx2.clearRect(0,0,D.w,D.h);dirty()}

function shapePath(c,a,b,type){

    case 'arrow':{c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);const an=Math.atan2(b.y-a.y,b.x-a.x),hl=Math.max(S.size*3,14);
      c.moveTo(b.x-hl*Math.cos(an-.45),b.y-hl*Math.sin(an-.45));c.lineTo(b.x,b.y);c.lineTo(b.x-hl*Math.cos(an+.45),b.y-hl*Math.sin(an+.45));break}

    case 'rrect':{const r=Math.min(w,h)*.22;c.moveTo(x0+r,y0);c.arcTo(x1,y0,x1,y1,r);c.arcTo(x1,y1,x0,y1,r);c.arcTo(x0,y1,x0,y0,r);c.arcTo(x0,y0,x1,y0,r);c.closePath();break}

function constrain(a,b,shift){

}

/* ================= FILL / PICK ================= */
function flatten(bgWhite){
  const c=mk(D.w,D.h),x=c.getContext('2d');if(bgWhite){x.fillStyle='#fff';x.fillRect(0,0,D.w,D.h)}
  D.layers.forEach(L=>{if(!L.visible)return;x.globalAlpha=L.opacity;x.globalCompositeOperation=L.blend;x.drawImage(L.canvas,0,0)});
  x.globalAlpha=1;x.globalCompositeOperation='source-over';return c;
}
function doFill(p,col){
  commitFloating();
  const X=Math.floor(p.x),Y=Math.floor(p.y),W=D.w,H=D.h;if(X<0||Y<0||X>=W||Y>=H)return;
  const L=AL();if(!L.visible){toast('Bu katman gizli');return}
  const src=S.fillAll?flatten(false).getContext('2d'):L.ctx;
  const d=src.getImageData(0,0,W,H).data;const i0=(Y*W+X)*4;
  const tr=d[i0],tg=d[i0+1],tb=d[i0+2],ta=d[i0+3],tol=S.tolerance;
  if(sel&&!(X>=sel.x&&Y>=sel.y&&X<sel.x+sel.w&&Y<sel.y+sel.h))return;
  const mask=new Uint8Array(W*H);
  const ok=q=>{const i=q*4;return Math.abs(d[i]-tr)<=tol&&Math.abs(d[i+1]-tg)<=tol&&Math.abs(d[i+2]-tb)<=tol&&Math.abs(d[i+3]-ta)<=tol};
  const st=[X,Y];
  while(st.length){
    const y=st.pop();let x=st.pop();let q=y*W+x;
    while(x>=0&&!mask[q]&&ok(q)){x--;q--}x++;q++;
    let up=false,dn=false;
    while(x<W&&!mask[q]&&ok(q)){
      mask[q]=1;
      if(y>0){const u=q-W;if(!mask[u]&&ok(u)){if(!up){st.push(x,y-1);up=true}}else up=false}
      if(y<H-1){const u=q+W;if(!mask[u]&&ok(u)){if(!dn){st.push(x,y+1);dn=true}}else dn=false}
      x++;q++;
    }
  }
  const n=parseInt(col.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  const out=stx.createImageData(W,H),o=out.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const q=y*W+x;
    if(mask[q]||(x>0&&mask[q-1])||(x<W-1&&mask[q+1])||(y>0&&mask[q-W])||(y<H-1&&mask[q+W])){const i=q*4;o[i]=r;o[i+1]=g;o[i+2]=b;o[i+3]=255}}
  stx.putImageData(out,0,0);
  strokeOp='source-over';strokeAlpha=S.opacity/100;strokeNeon=false;
  commitTemp(col);
}
function pickColor(p,alt){
  const X=Math.floor(p.x),Y=Math.floor(p.y);if(X<0||Y<0||X>=D.w||Y>=D.h)return;
  const f=flatten(true);const d=f.getContext('2d').getImageData(X,Y,1,1).data;
  const h='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  setColor(alt?'secondary':'primary',h);toast((alt?'İkinci renk: ':'Ana renk: ')+h.toUpperCase());
}

const normR=(a,b)=>{let x=Math.round(Math.min(a.x,b.x)),y=Math.round(Math.min(a.y,b.y)),x2=Math.round(Math.max(a.x,b.x)),y2=Math.round(Math.max(a.y,b.y));x=clamp(x,0,D.w);y=clamp(y,0,D.h);x2=clamp(x2,0,D.w);y2=clamp(y2,0,D.h);return{x,y,w:x2-x,h:y2-y}};

/* ================= IMAGES ================= */
function loadImageBlob(blob){
  const url=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);const s=Math.min(1,D.w*.9/im.width,D.h*.9/im.height);const w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
    const c=mk(im.width,im.height);c.getContext('2d').drawImage(im,0,0);
    makeFloating(c,Math.round((D.w-w)/2),Math.round((D.h-h)/2),w,h);toast('Resmi sürükle, köşeden boyutlandır, sonra ✓ Uygula')};
  im.onerror=()=>{URL.revokeObjectURL(url);toast('Resim açılamadı')};im.src=url;
}
const fileIn=$('#fileIn');fileIn.onchange=()=>{const f=fileIn.files[0];if(f)loadImageBlob(f);fileIn.value=''};
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{e.preventDefault();const f=[...(e.dataTransfer.files||[])].find(f=>f.type.startsWith('image/'));if(f)loadImageBlob(f)});
document.addEventListener('paste',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName))return;
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));
  if(it){e.preventDefault();loadImageBlob(it.getAsFile())}else if(clip){e.preventDefault();pasteClip()}
});

const FONTS=['Arial','Georgia','Times New Roman','Courier New','Verdana','Trebuchet MS','Impact','Comic Sans MS','Palatino','system-ui','cursive','monospace'];
function renderText(t,col,col2){
  const st=(S.italic?'italic ':'')+(S.bold?'bold ':'')+S.textSize+'px "'+S.font+'"';
  const lines=t.split('\n');const m=mk(4,4).getContext('2d');m.font=st;
  const lh=Math.round(S.textSize*1.2),pad=Math.ceil(S.textSize*.25)+(S.tShadow?Math.ceil(S.textSize*.12):0)+(S.tOutline?Math.ceil(S.textSize*.08):0);
  const ws=lines.map(l=>m.measureText(l).width),W=Math.ceil(Math.max(1,...ws))+pad*2,H=lh*lines.length+pad*2;
  const c=mk(W,H),x=c.getContext('2d');x.font=st;x.textBaseline='middle';x.lineJoin='round';
  lines.forEach((l,i)=>{const lx=S.tAlign==='center'?(W-ws[i])/2:S.tAlign==='right'?W-pad-ws[i]:pad;const ly=pad+lh*i+lh/2;
    if(S.tShadow){x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=S.textSize*.12;x.shadowOffsetX=x.shadowOffsetY=S.textSize*.06;x.fillStyle=col;x.fillText(l,lx,ly);x.restore()}
    if(S.tOutline){x.lineWidth=Math.max(2,S.textSize*.12);x.strokeStyle=col2;x.strokeText(l,lx,ly)}
    x.fillStyle=col;x.fillText(l,lx,ly)});
  return c;
}

    <div class="checks">
      <button class="chip ${S.bold?'on':''}" data-k="bold"><b>K</b> Kalın</button>
      <button class="chip ${S.italic?'on':''}" data-k="italic"><i>E</i> Eğik</button>
      <button class="chip ${S.tOutline?'on':''}" data-k="tOutline">Kenarlık</button>
      <button class="chip ${S.tShadow?'on':''}" data-k="tShadow">Gölge</button>
    </div>
    <div class="checks">${['left','center','right'].map(a=>`<button class="chip ${S.tAlign===a?'on':''}" data-al="${a}">${{left:'Sola',center:'Ortala',right:'Sağa'}[a]}</button>`).join('')}</div>
    <p class="note" style="text-align:left;font-size:12px">Renk: ana renk. Kenarlık: ikinci renk. Ekledikten sonra yazıyı sürükleyip köşeden büyütebilirsin.</p>`,
    [{t:'Vazgeç',c:'g'},{t:'Ekle',fn:()=>{const t=$('#tTx').value;if(!t.trim())return false;const c=renderText(t,col,col2);makeFloating(c,Math.round(p.x),Math.round(p.y-c.height/2));savePrefs()}}]);
  const tx=$('#tTx'),pv=$('#textPrev');
  const upd=()=>{S.font=$('#tFont').value;S.textSize=clamp(+$('#tSize').value||72,6,600);const pc=pv.getContext('2d');pv.width=pv.clientWidth*DPR;pv.height=pv.clientHeight*DPR;pc.clearRect(0,0,pv.width,pv.height);
    const t=tx.value||'Örnek Yazı';const c=renderText(t,col,col2);const s=Math.min(pv.width*.94/c.width,pv.height*.9/c.height,1.5*DPR);pc.drawImage(c,(pv.width-c.width*s)/2,(pv.height-c.height*s)/2,c.width*s,c.height*s)};
  b.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{S[x.dataset.k]=!S[x.dataset.k];x.classList.toggle('on',S[x.dataset.k]);upd()});
  b.querySelectorAll('[data-al]').forEach(x=>x.onclick=()=>{S.tAlign=x.dataset.al;b.querySelectorAll('[data-al]').forEach(y=>y.classList.toggle('on',y===x));upd()});
  tx.oninput=upd;$('#tFont').onchange=upd;$('#tSize').oninput=upd;
  setTimeout(()=>{upd();tx.focus()},30);
}

/* ================= POINTER INPUT ================= */
const ptrs=new Map();
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('pointerdown',e=>{
  e.preventDefault();view.focus({preventScroll:true});
  try{view.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  if(e.pointerType==='pen')penSeen=true;
  if(e.pointerType==='touch'&&ptrs.size===2){if(act)cancelAct();startPinch();return}
  if(ptrs.size>1||act)return;
  if(e.button===1||spaceDown||S.tool==='hand'||(penSeen&&e.pointerType==='touch')){act={kind:'pan',sx:e.clientX,sy:e.clientY,ox:V.x,oy:V.y,id:e.pointerId};view.style.cursor='grabbing';return}
  if(e.button>2)return;
  const alt=e.button===2;const p=toDoc(e.clientX,e.clientY);
  const col=alt?S.secondary:S.primary,col2=alt?S.primary:S.secondary;
  switch(S.tool){
    case 'brush':case 'eraser':beginStroke(p,e,col);break;
    case 'shape':commitFloating();if(!AL().visible){toast('Bu katman gizli');break}stroking=true;strokeOp='source-over';strokeAlpha=S.opacity/100;strokeNeon=false;stx.clearRect(0,0,D.w,D.h);act={kind:'shape',a:p,b:p,col,col2,id:e.pointerId,shift:e.shiftKey};break;
    case 'gradient':commitFloating();if(!AL().visible){toast('Bu katman gizli');break}stroking=true;strokeOp='source-over';strokeAlpha=S.opacity/100;strokeNeon=false;act={kind:'grad',a:p,b:p,col,col2,id:e.pointerId};break;
    case 'fill':doFill(p,col);break;
    case 'picker':pickColor(p,alt);break;
    case 'text':openTextDialog(p,col,col2);break;
    case 'select':selectDown(p,e);break;
  }
});
function selectDown(p,e){
  if(floating){
    if(hitHandle(e)){act={kind:'fscale',sp:p,f0:{x:floating.x,y:floating.y,w:floating.w,h:floating.h},id:e.pointerId};return}
    if(inR(p,floating)){act={kind:'fmove',sp:p,x0:floating.x,y0:floating.y,id:e.pointerId};return}
    commitFloating();
  }
  if(sel&&inR(p,sel)){lift();act={kind:'fmove',sp:p,x0:floating.x,y0:floating.y,id:e.pointerId};return}
  act={kind:'marquee',a:p,r:null,id:e.pointerId};sel=null;updOpts();dirty();
}
function startPinch(){const [a,b]=[...ptrs.values()];const r=view.getBoundingClientRect();
  act={kind:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top},s0:V.s,x0:V.x,y0:V.y,t0:performance.now(),moved:false}}
function cancelAct(){
  if(!act)return;
  if(act.kind==='stroke'||act.kind==='shape'||act.kind==='grad')cancelStroke();
  if(act.kind==='marquee')sel=null;
  act=null;dirty();
}
view.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  const p=toDoc(e.clientX,e.clientY);
  hover={x:p.x,y:p.y,mouse:e.pointerType==='mouse'};
  if(!act){updHud();updCursor(e,p);if(hover.mouse)dirty();return}
  if(act.kind==='pinch'){
    if(ptrs.size<2)return;const [a,b]=[...ptrs.values()];const r=view.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
    const s=clamp(act.s0*d/act.d0,.03,40);
    V.x=m.x-(act.m0.x-act.x0)/act.s0*s;V.y=m.y-(act.m0.y-act.y0)/act.s0*s;V.s=s;
    if(Math.abs(d-act.d0)>12||Math.hypot(m.x-act.m0.x,m.y-act.m0.y)>12)act.moved=true;
    dirty();updHud();return;
  }

  switch(act.kind){
    case 'pan':V.x=act.ox+e.clientX-act.sx;V.y=act.oy+e.clientY-act.sy;dirty();break;
    case 'stroke':strokeMove(e.getCoalescedEvents?e.getCoalescedEvents():[e]);break;
    case 'shape':act.b=p;act.shift=e.shiftKey;drawShapePreview();break;
    case 'grad':act.b=p;drawGradPreview();break;
    case 'marquee':act.r=normR(act.a,p);dirty();break;
    case 'fmove':floating.x=Math.round(act.x0+p.x-act.sp.x);floating.y=Math.round(act.y0+p.y-act.sp.y);dirty();break;
    case 'fscale':{const f0=act.f0;let w=Math.max(4,f0.w+p.x-act.sp.x),h=Math.max(4,f0.h+p.y-act.sp.y);if(!e.shiftKey){const k=Math.max(w/f0.w,h/f0.h);w=Math.max(4,f0.w*k);h=Math.max(4,f0.h*k)}floating.w=Math.round(w);floating.h=Math.round(h);dirty();break}
  }

});
function endPointer(e){
  ptrs.delete(e.pointerId);

  if(act.kind==='pinch'){
    if(ptrs.size===0){const quick=!act.moved&&performance.now()-act.t0<300;act=null;if(quick){undo();toast('Geri alındı')}}
    return;
  }
  if(act.kind==='none'){if(ptrs.size===0)act=null;return}
  if(e.pointerId!==act.id)return;
  const a=act;
  switch(a.kind){
    case 'stroke':endStroke();break;
    case 'shape':{if(Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y)*V.s<3){cancelStroke();break}commitTemp(a.col);break}
    case 'grad':{if(Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y)*V.s<3){cancelStroke();break}commitTemp(a.col);break}
    case 'marquee':sel=a.r&&a.r.w>1&&a.r.h>1?a.r:null;updOpts();break;

view.addEventListener('pointerup',endPointer);view.addEventListener('pointercancel',endPointer);

function updCursor(e,p){

  else if(S.tool==='select'){c='crosshair';if(floating&&hitHandle(e))c='nwse-resize';else if((floating&&inR(p,floating))||(sel&&inR(p,sel)))c='move'}

const KEYTOOLS={b:'brush',e:'eraser',g:'fill',r:'gradient',i:'picker',t:'text',u:'shape',m:'select',v:'select',h:'hand'};
window.addEventListener('keydown',e=>{
  const tg=document.activeElement&&document.activeElement.tagName;
  const modalOpen=$('#modal').classList.contains('show');
  if(e.key==='Escape'){if(modalOpen){closeDialog();return}if(floating){cancelFloating();return}if(sel){deselect();return}if(document.body.parentElement&&$('#app').classList.contains('side-open')&&innerWidth<1000){toggleSide(false)}return}
  if(modalOpen||/INPUT|TEXTAREA|SELECT/.test(tg))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(k==='y'){e.preventDefault();redo()}
    else if(k==='c'){e.preventDefault();copySel()}
    else if(k==='x'){e.preventDefault();cutSel()}
    else if(k==='a'){e.preventDefault();selectAll()}
    else if(k==='d'){e.preventDefault();deselect()}
    else if(k==='s'){e.preventDefault();exportDialog()}
    else if(k==='o'){e.preventDefault();fileIn.click()}
    else if(k==='n'&&e.shiftKey){e.preventDefault();addLayer()}
    else if(k==='0'){e.preventDefault();fit()}
    else if(k==='1'){e.preventDefault();zoomTo(1)}
    return;
  }
  if(e.key===' '){if(!spaceDown){spaceDown=true;view.style.cursor='grab'}e.preventDefault();return}
  if(KEYTOOLS[k]){setTool(KEYTOOLS[k]);return}
  if(k==='l'){S.shape='line';setTool('shape');return}
  if(k==='o'){S.shape='ellipse';setTool('shape');return}
  if(k==='x'){swapColors();return}
  if(k==='['){S.size=clamp(Math.round(S.size/1.15)-(S.size<8?1:0),1,300);updOpts();dirty();return}
  if(k===']'){S.size=clamp(Math.round(S.size*1.15)+(S.size<8?1:0),1,300);updOpts();dirty();return}
  if(k==='+'||k==='='){zoomTo(V.s*1.25);return}
  if(k==='-'){zoomTo(V.s/1.25);return}
  if(k==='0'){fit();return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return}
  if(e.key==='Enter'){commitFloating();return}
  if(/^[1-9]$/.test(k)){S.opacity=+k*10;updOpts();return}
  if(e.key==='?'){helpDialog();return}
});

  const lut=f=>{for(let i=0;i<n;i+=4){d[i]=f(d[i]);d[i+1]=f(d[i+1]);d[i+2]=f(d[i+2])}};
  switch(name){
    case 'gray':for(let i=0;i<n;i+=4){const v=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i]=d[i+1]=d[i+2]=v}break;
    case 'invert':lut(v=>255-v);break;
    case 'sepia':for(let i=0;i<n;i+=4){const r0=d[i],g0=d[i+1],b0=d[i+2];d[i]=r0*.393+g0*.769+b0*.189;d[i+1]=r0*.349+g0*.686+b0*.168;d[i+2]=r0*.272+g0*.534+b0*.131}break;
    case 'bright':lut(v=>v+28);break;
    case 'dark':lut(v=>v-28);break;
    case 'contrast':lut(v=>(v-128)*1.25+128);break;
    case 'sat':for(let i=0;i<n;i+=4){const g=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i]=g+(d[i]-g)*1.4;d[i+1]=g+(d[i+1]-g)*1.4;d[i+2]=g+(d[i+2]-g)*1.4}break;
    case 'poster':lut(v=>Math.round(v/255*4)*255/4);break;
    case 'noise':for(let i=0;i<n;i+=4){const k=(Math.random()-.5)*50;d[i]+=k;d[i+1]+=k;d[i+2]+=k}break;
    case 'blur':blur(d,r.w,r.h,2);blur(d,r.w,r.h,2);break;
    case 'sharpen':conv(d,r.w,r.h,[0,-1,0,-1,5,-1,0,-1,0]);break;
    case 'emboss':conv(d,r.w,r.h,[-2,-1,0,-1,1,1,0,1,2]);break;
    case 'edges':conv(d,r.w,r.h,[-1,-1,-1,-1,8,-1,-1,-1,-1]);break;
  }
  L.ctx.putImageData(img,r.x,r.y);afterChange(L);
}
function blur(d,w,h,rad){
  // premultiplied separable box blur on all channels
  const t=new Float32Array(d.length);
  for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;t[i]=d[i]*a;t[i+1]=d[i+1]*a;t[i+2]=d[i+2]*a;t[i+3]=d[i+3]}
  const u=new Float32Array(d.length);
  const pass=(src,dst,horiz)=>{const L=horiz?w:h,M=horiz?h:w;for(let m=0;m<M;m++){for(let l=0;l<L;l++){let s0=0,s1=0,s2=0,s3=0,c=0;for(let k=-rad;k<=rad;k++){const q=clamp(l+k,0,L-1);const idx=(horiz?(m*w+q):(q*w+m))*4;s0+=src[idx];s1+=src[idx+1];s2+=src[idx+2];s3+=src[idx+3];c++}const o=(horiz?(m*w+l):(l*w+m))*4;dst[o]=s0/c;dst[o+1]=s1/c;dst[o+2]=s2/c;dst[o+3]=s3/c}}};
  pass(t,u,true);pass(u,t,false);
  for(let i=0;i<d.length;i+=4){const a=t[i+3]/255;d[i+3]=t[i+3];if(a>0){d[i]=t[i]/a;d[i+1]=t[i+1]/a;d[i+2]=t[i+2]/a}}
}
function conv(d,w,h,k){const s=new Uint8ClampedArray(d);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let r=0,g=0,b=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const q=(clamp(y+j,0,h-1)*w+clamp(x+i,0,w-1))*4,kk=k[(j+1)*3+i+1];r+=s[q]*kk;g+=s[q+1]*kk;b+=s[q+2]*kk}const o=(y*w+x)*4;d[o]=r;d[o+1]=g;d[o+2]=b}}
function rotateDoc(dir){commitFloating();pushD();D.layers.forEach(L=>{const c=mk(D.h,D.w),x=c.getContext('2d');if(dir>0){x.translate(D.h,0);x.rotate(Math.PI/2)}else{x.translate(0,D.w);x.rotate(-Math.PI/2)}x.drawImage(L.canvas,0,0);L.canvas=c;L.ctx=x;x.setTransform(1,0,0,1,0,0)});[D.w,D.h]=[D.h,D.w];resetAux();fit();afterChange()}
function flipDoc(h){commitFloating();pushD();D.layers.forEach(L=>{const c=mk(D.w,D.h),x=c.getContext('2d');if(h){x.translate(D.w,0);x.scale(-1,1)}else{x.translate(0,D.h);x.scale(1,-1)}x.drawImage(L.canvas,0,0);x.setTransform(1,0,0,1,0,0);L.canvas=c;L.ctx=x});resetAux();afterChange()}
function resizeDoc(nw,nh,mode){commitFloating();pushD();D.layers.forEach((L,i)=>{const c=mk(nw,nh),x=c.getContext('2d');if(mode==='scale'){x.imageSmoothingQuality='high';x.drawImage(L.canvas,0,0,nw,nh)}else{if(i===0&&mode==='extend'){x.fillStyle='#fff';x.fillRect(0,0,nw,nh)}x.drawImage(L.canvas,Math.round((nw-D.w)/2),Math.round((nh-D.h)/2))}L.canvas=c;L.ctx=x});D.w=nw;D.h=nh;resetAux();fit();afterChange()}

/* ================= DIALOGS ================= */
function dialog(title,body,buttons){
  const m=$('#modal');m.innerHTML='';const d=el('div','dlg');
  d.innerHTML=`<h3>${title}<button title="Kapat">✕</button></h3><div class="body">${body}</div>`;
  d.querySelector('h3 button').onclick=closeDialog;
  if(buttons&&buttons.length){const f=el('div','foot');buttons.forEach(b=>{const x=el('button','btn '+(b.c||''),b.t);x.onclick=()=>{if(b.fn&&b.fn()===false)return;closeDialog()};f.appendChild(x)});d.appendChild(f)}
  m.appendChild(d);m.classList.add('show');m.onclick=e=>{if(e.target===m)closeDialog()};return d;
}
function closeDialog(){$('#modal').classList.remove('show');$('#modal').innerHTML='';view.focus({preventScroll:true})}
function confirmD(msg,fn,ok='Tamam'){dialog('Emin misin?',`<p style="margin:0">${msg}</p>`,[{t:'Vazgeç',c:'g'},{t:ok,c:'d',fn}])}

function newDocDialog(){
  const sw=Math.round(SW*DPR),sh=Math.round(SH*DPR);
  const P=[['Ekran',sw,sh],['Kare',1080,1080],['Yatay HD',1920,1080],['Dikey (story)',1080,1920],['A4 dikey',1240,1754],['A4 yatay',1754,1240],['Küçük',800,600],['Piksel sanatı',64,64]];
  const b=dialog('Yeni tuval',`
    <div class="checks" id="ndP">${P.map((p,i)=>`<button class="chip" data-i="${i}">${p[0]} <small style="color:var(--mut)">${p[1]}×${p[2]}</small></button>`).join('')}</div>
    <div class="frow"><div class="field">Genişlik<input id="ndW" type="number" min="1" max="4096" value="${D.w}"></div><div class="field">Yükseklik<input id="ndH" type="number" min="1" max="4096" value="${D.h}"></div></div>
    <div class="field">Arka plan<select id="ndB"><option value="#ffffff">Beyaz</option><option value="">Saydam</option><option value="#000000">Siyah</option><option value="cur">İkinci renk</option></select></div>
    <p class="note" style="text-align:left;font-size:12px">Mevcut çizim kapanır; istersen Geri al ile dönebilirsin.</p>`,
    [{t:'Vazgeç',c:'g'},{t:'Oluştur',fn:()=>{const w=clamp(+$('#ndW').value|0,1,4096),h=clamp(+$('#ndH').value|0,1,4096);let bg=$('#ndB').value;if(bg==='cur')bg=S.secondary;commitFloating();pushD();initDoc(w,h,bg||null);toast(`Yeni tuval: ${w}×${h}`)}}]);
  b.querySelectorAll('#ndP .chip').forEach(c=>c.onclick=()=>{const p=P[+c.dataset.i];$('#ndW').value=p[1];$('#ndH').value=p[2];b.querySelectorAll('#ndP .chip').forEach(x=>x.classList.toggle('on',x===c))});
}
function resizeDialog(){
  const b=dialog('Tuval boyutu',`
    <div class="frow"><div class="field">Genişlik<input id="rsW" type="number" min="1" max="4096" value="${D.w}"></div><div class="field">Yükseklik<input id="rsH" type="number" min="1" max="4096" value="${D.h}"></div></div>
    <div class="checks"><button class="chip on" id="rsK">🔗 Oranı koru</button></div>
    <div class="field">Yöntem<select id="rsM"><option value="scale">Resmi ölçekle</option><option value="extend">Tuvali genişlet / kırp (ortadan)</option></select></div>`,
    [{t:'Vazgeç',c:'g'},{t:'Uygula',fn:()=>{const w=clamp(+$('#rsW').value|0,1,4096),h=clamp(+$('#rsH').value|0,1,4096);resizeDoc(w,h,$('#rsM').value)}}]);
  let keep=true;const ar=D.w/D.h;$('#rsK').onclick=e=>{keep=!keep;e.currentTarget.classList.toggle('on',keep)};
  $('#rsW').oninput=()=>{if(keep)$('#rsH').value=Math.round($('#rsW').value/ar)};$('#rsH').oninput=()=>{if(keep)$('#rsW').value=Math.round($('#rsH').value*ar)};
}
function exportDialog(){
  commitFloating();
  let fmt='png';
  const b=dialog('Kaydet / Dışa aktar',`
    <div class="checks"><button class="chip on" data-f="png">PNG (saydamlık korunur)</button><button class="chip" data-f="jpeg">JPG (küçük dosya)</button></div>
    <img id="outImg" alt="Çizimin">
    <p class="note">Telefonda resme <b>uzun bas</b> → “Resmi kaydet”.<br>Bilgisayarda <b>sağ tık</b> → “Resmi farklı kaydet”.</p>`,
    [{t:'Panoya kopyala',c:'g',fn:()=>{copyImage();return false}},{t:'Kapat'}]);
  const upd=()=>{const f=flatten(fmt==='jpeg');$('#outImg').src=f.toDataURL('image/'+fmt,.92)};
  b.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{fmt=c.dataset.f;b.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===c));upd()});
  upd();
}
function copyImage(){
  try{flatten(false).toBlob(async bl=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':bl})]);toast('Resim panoya kopyalandı')}catch(e){toast('Bu cihazda panoya kopyalanamıyor — uzun bas / sağ tık ile kaydet')}},'image/png')}catch(e){toast('Panoya kopyalanamadı')}
}
function helpDialog(){
  const K=[['B','Fırça'],['E','Silgi'],['G','Boya kovası'],['R','Degrade'],['U','Şekiller'],['L / O','Çizgi / Elips'],['T','Metin'],['I','Damlalık'],['M / V','Seçim'],['H veya Boşluk + sürükle','Kaydır'],['[  ]','Fırça boyutu'],['1 … 9','Opaklık %10–90'],['X','Renkleri değiştir'],['Sağ tık','İkinci renkle çiz'],['Tekerlek / Ctrl+tekerlek','Yakınlaştır'],['Shift+tekerlek','Yatay kaydır'],['Orta tuş sürükle','Kaydır'],['+ / − / 0','Zoom / sığdır'],['Ctrl+Z / Ctrl+Y','Geri al / Yinele'],['Ctrl+C / X / V','Kopyala / Kes / Yapıştır'],['Ctrl+A / Ctrl+D','Tümünü seç / Seçimi kaldır'],['Delete','Seçimi sil'],['Enter / Esc','Uygula / İptal'],['Ctrl+S','Kaydet'],['Ctrl+O','Resim aç'],['Ctrl+Shift+N','Yeni katman'],['Shift (şekilde)','Kare / düz çizgi'],['Shift (boyutlandırırken)','Serbest oran']];
  const G=[['İki parmak sıkıştır','Yakınlaştır / kaydır'],['İki parmakla dokun','Geri al'],['Kalem kullanınca','Parmak sadece kaydırır (avuç koruması)']];
  dialog('Kısayollar ve hareketler',`<div class="lbl" style="margin-top:0">Klavye ve fare</div><div class="keys">${K.map(k=>`<kbd>${k[0]}</kbd><span>${k[1]}</span>`).join('')}</div><div class="lbl">Dokunmatik</div><div class="keys">${G.map(k=>`<kbd>${k[0]}</kbd><span>${k[1]}</span>`).join('')}</div>`,[{t:'Tamam'}]);
}
function menuDialog(){
  const items=[
    ['Dosya'],['Yeni tuval…',newDocDialog,'Ctrl+N'],['Resim aç…',()=>fileIn.click(),'Ctrl+O'],['Kaydet / dışa aktar…',exportDialog,'Ctrl+S'],['Panoya kopyala',copyImage],
    ['Düzen'],['Geri al',undo,'Ctrl+Z'],['Yinele',redo,'Ctrl+Y'],['Tümünü seç',selectAll,'Ctrl+A'],['Kopyala',()=>copySel(),'Ctrl+C'],['Kes',cutSel,'Ctrl+X'],['Yapıştır',pasteClip,'Ctrl+V'],['Seçimi sil',deleteSel,'Del'],['Seçime kırp',cropToSel],['Seçimi kaldır',deselect,'Ctrl+D'],
    ['Tuval'],['Tuval boyutu…',resizeDialog],['Sağa döndür 90°',()=>rotateDoc(1)],['Sola döndür 90°',()=>rotateDoc(-1)],['Yatay çevir',()=>flipDoc(true)],['Dikey çevir',()=>flipDoc(false)],['Tuvali temizle',()=>confirmD('Tüm katmanlar temizlenecek.',()=>{commitFloating();pushD();D.layers.forEach((L,i)=>{L.ctx.clearRect(0,0,D.w,D.h);if(i===0){L.ctx.fillStyle='#fff';L.ctx.fillRect(0,0,D.w,D.h)}});afterChange()},'Temizle')],
    ['Efektler (aktif katman / seçim)'],['Gri ton',()=>applyFx('gray')],['Renkleri ters çevir',()=>applyFx('invert')],['Sepya',()=>applyFx('sepia')],['Parlaklık +',()=>applyFx('bright')],['Parlaklık −',()=>applyFx('dark')],['Kontrast +',()=>applyFx('contrast')],['Doygunluk +',()=>applyFx('sat')],['Bulanıklaştır',()=>applyFx('blur')],['Keskinleştir',()=>applyFx('sharpen')],['Kabartma',()=>applyFx('emboss')],['Kenar bul',()=>applyFx('edges')],['Posterleştir',()=>applyFx('poster')],['Pikselleştir',()=>applyFx('pixel')],['Gren / gürültü',()=>applyFx('noise')],['Katmanı yatay çevir',()=>applyFx('flipLH')],['Katmanı dikey çevir',()=>applyFx('flipLV')],
    ['Görünüm'],['Ekrana sığdır',fit,'0'],['Gerçek boyut %100',()=>zoomTo(1),'Ctrl+1'],[S.grid?'Izgarayı gizle':'Izgarayı göster',()=>{S.grid=!S.grid;savePrefs();dirty()}],['Tam ekran',toggleFS],['Kısayollar ve yardım',helpDialog,'?']
  ];
  const b=dialog('Menü',`<div class="menu">${items.map((it,i)=>it.length===1?`<h4>${it[0]}</h4>`:`<button data-i="${i}">${it[0]}${it[2]?`<kbd>${it[2]}</kbd>`:''}</button>`).join('')}</div>`,null);
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const f=items[+x.dataset.i][1];closeDialog();setTimeout(f,10)});
}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else{const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Tam ekran bu görünümde desteklenmiyor'))}}catch(e){toast('Tam ekran bu görünümde desteklenmiyor')}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&!e.shiftKey){e.preventDefault();newDocDialog()}});

/* ================= TOP BUTTONS ================= */
$('#bMenu').onclick=menuDialog;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bSave').onclick=exportDialog;
$('#zIn').onclick=()=>zoomTo(V.s*1.25);$('#zOut').onclick=()=>zoomTo(V.s/1.25);$('#zFit').onclick=fit;$('#zPct').onclick=()=>zoomTo(1);
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1900)}

/* ================= PERSISTENCE ================= */
function afterChange(){dirty();thumbsSoon();autosave();updUR();updHud()}
let asT=null;function autosave(){clearTimeout(asT);asT=setTimeout(doSave,1500)}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('cizim-atolyesi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbDo(db,mode,fn){return new Promise((res,rej)=>{try{const tx=db.transaction('kv',mode),st=tx.objectStore('kv');const q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}
async function doSave(){try{const db=await idb();const blobs=await Promise.all(D.layers.map(L=>new Promise(r=>L.canvas.toBlob(r,'image/png'))));
  const meta={w:D.w,h:D.h,active:D.active,layers:D.layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend}))};await idbDo(db,'readwrite',st=>st.put({meta,blobs},'doc'))}catch(e){}}
async function doLoad(){
  const db=await idb();const rec=await idbDo(db,'readonly',st=>st.get('doc'));if(!rec||!rec.meta||!rec.blobs)return false;
  const m=rec.meta;D.w=m.w;D.h=m.h;D.layers=[];
  for(let i=0;i<m.layers.length;i++){const L=newLayer(m.layers[i].name,m.w,m.h);Object.assign(L,{visible:m.layers[i].visible,opacity:m.layers[i].opacity,blend:m.layers[i].blend});
    const b=rec.blobs[i];if(b){const im=await new Promise(r=>{const u=URL.createObjectURL(b),x=new Image();x.onload=()=>{URL.revokeObjectURL(u);r(x)};x.onerror=()=>r(null);x.src=u});if(im)L.ctx.drawImage(im,0,0)}D.layers.push(L)}
  D.active=clamp(m.active,0,D.layers.length-1);resetAux();fit();refreshLayers();dirty();return true;
}

/* ================= BOOT ================= */
new ResizeObserver(()=>{resizeView();if(app.classList.contains('side-open'))drawPickers()}).observe(stage);
resizeView();
renderRecent();syncColorUI();setTool(S.tool==='text'?'brush':S.tool);
(async()=>{
  let ok=false;try{ok=await doLoad()}catch(e){}
  if(!ok){const lw=Math.round(SW*DPR),lh=Math.round(SH*DPR),k=Math.min(1,1800/Math.max(lw,lh));initDoc(Math.max(64,Math.round(lw*k)),Math.max(64,Math.round(lh*k)),'#ffffff');hist.length=0;updUR()}
  else toast('Son çizimin geri yüklendi');
  if(innerWidth>=1000)openSide('color');
  updOpts();updHud();
})();
// expose for tests
window.__CA={D,S,V,get sel(){return sel},get floating(){return floating},hist,undo,redo,setTool,applyFx,addLayer,selectAll,fit};
})();
